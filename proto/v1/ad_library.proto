syntax = "proto3";

package fb_agent.ad_library.v1;

// AdLibraryService — поиск рекламы в Meta Ad Library через активную Vision-сессию.
//
// Архитектурная заметка: публичный Ad Library API (через токен) НЕ покрывает наши
// GEO (Африка/LatAm/Турция — outside EU/UK). Standalone scraper'ы (curl_cffi,
// requests) моментально rate-limit'ятся Meta по IP/fingerprint.
//
// Поэтому работает session-tunneling: browser-agent открывает Ad Library страницу
// в новой вкладке той же Vision-сессии (где уже залогинен Facebook), перехватывает
// GraphQL responses и возвращает ads через gRPC. Meta видит залогиненного юзера,
// rate-limit мягкий.
service AdLibraryService {
  // Поиск ads по keyword + country. Возвращает массив raw GraphQL ads
  // (структура сохранена для гибкого парсинга на Python-стороне).
  rpc SearchAds(SearchAdsRequest) returns (SearchAdsResponse);

  // Batch-поиск: открывает Ad Library один раз для country, прогоняет все
  // queries через input.fill() (как реальный юзер), возвращает результаты пачкой.
  // Это стабильнее чем серия SearchAds — Meta не блокирует повторные fetch
  // потому что юзер "печатает" в input, а не делает goto на новый URL.
  rpc SearchAdsBatch(SearchAdsBatchRequest) returns (SearchAdsBatchResponse);

  // Проверить готовность канала: жив ли browser context, доступна ли Ad Library.
  // Не делает реальных запросов к Meta — только проверка окружения.
  rpc CheckAdLibraryHealth(CheckAdLibraryHealthRequest) returns (CheckAdLibraryHealthResponse);
}

message SearchAdsRequest {
  // ID активной browser-сессии. Если пустой — используется preferred session.
  string session_id = 1;

  // ISO-2 код страны: "KE", "CD", "MZ", "GH", "TR", "IT", ...
  string country = 2;

  // Ключевое слово для поиска (например "Chicken Road 2").
  string query = 3;

  // "active" / "inactive" / "all". По умолчанию "active".
  string active_status = 4;

  // "all" / "political_and_issue_ads". По умолчанию "all".
  string ad_type = 5;

  // Таймаут одного GraphQL-запроса в миллисекундах (по умолчанию 60_000).
  optional int32 timeout_ms = 6;

  // "keyword_unordered" (default) / "keyword_exact_phrase" / "page".
  // exact_phrase отсекает "Chicken Cages" в выдаче "Chicken Road 2".
  string search_type = 7;

  // Максимум pagination-итераций (по умолчанию 5 → ~150 ads при page_size=30).
  optional int32 max_pages = 8;

  // Размер страницы pagination (по умолчанию 30, как в Meta UI).
  optional int32 page_size = 9;
}

message SearchAdsResponse {
  // Сколько ads вернулось (после дедупликации по ad_archive_id).
  int32 ad_count = 1;

  // Raw JSON array ads (вся структура GraphQL response, как пришла от Meta).
  string ads_json = 2;

  // Длительность запроса в миллисекундах.
  int32 duration_ms = 3;

  // Сколько pagination-страниц реально получено.
  int32 pages_fetched = 4;

  // Заполняется при ошибке.
  optional AdLibraryError error = 5;
}

message AdLibraryError {
  // Внутренний код: -1 = network, -2 = no graphql response, -3 = page error.
  int32 code = 1;

  // Тип: "NetworkError", "NoGraphQLResponse", "PageError", "SessionNotFound".
  string type = 2;

  // Текст ошибки для логов/дебага.
  string message = 3;
}

message SearchAdsBatchRequest {
  // ID активной browser-сессии. Если пустой — preferred session.
  string session_id = 1;

  // ISO-2 код страны.
  string country = 2;

  // Список keyword'ов для прогона на этой стране (одна вкладка, переиспользуем токены).
  repeated string queries = 3;

  // "active" / "inactive" / "all". По умолчанию "active".
  string active_status = 4;

  // "all" / "political_and_issue_ads".
  string ad_type = 5;

  // Таймаут одного GraphQL-запроса в миллисекундах (по умолчанию 60_000).
  optional int32 per_query_timeout_ms = 6;

  // "keyword_unordered" (default) / "keyword_exact_phrase" / "page".
  string search_type = 7;

  // Максимум pagination-итераций на каждый query (по умолчанию 5).
  optional int32 max_pages = 8;

  // Размер страницы pagination (по умолчанию 30).
  optional int32 page_size = 9;
}

message SearchAdsBatchResponse {
  // Результат по каждому query (в том же порядке как в request.queries).
  repeated QueryResult results = 1;

  // Общая длительность всего batch'а.
  int32 total_duration_ms = 2;
}

message QueryResult {
  string query = 1;
  int32 ad_count = 2;
  string ads_json = 3;
  int32 duration_ms = 4;
  int32 pages_fetched = 5;
  optional AdLibraryError error = 6;
}

message CheckAdLibraryHealthRequest {
  // ID активной browser-сессии. Если пустой — используется preferred session.
  string session_id = 1;
}

message CheckAdLibraryHealthResponse {
  // True если browser context жив и можно открывать страницы.
  bool healthy = 1;

  // Детали: "ok" / "session_not_found" / "context_missing" / "browser_disconnected".
  string detail = 2;
}
