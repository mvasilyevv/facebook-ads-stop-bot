syntax = "proto3";

package fb_agent.browser_session.v1;

service BrowserSessionService {
  // Создать process-local browser-agent сессию, подключившись только к уже
  // живому Vision CDP. Этот RPC никогда не запускает и не рестартует профиль.
  rpc StartBrowser(StartBrowserRequest) returns (StartBrowserResponse);

  // Переподключиться после разрыва или ошибки.
  rpc ReconnectBrowser(ReconnectBrowserRequest) returns (StartBrowserResponse);

  // Принудительно перезапустить canonical Vision-профиль и подключиться заново.
  // Вызывается только API control plane после проверки PostgreSQL maintenance lease.
  rpc RecoverBrowserProfileUnderMaintenance(RecoverBrowserProfileRequest)
      returns (StartBrowserResponse);

  // Открыть вкладки Ads Manager для списка кабинетов (фаза "подготовка рабочего
  // места" перед сканом). Для каждого ad_account_id ищет/открывает вкладку кабинета
  // (manage/campaigns + колонки). Не сканирует. Идемпотентно: уже открытую переиспользует.
  rpc OpenCabinetTabs(OpenCabinetTabsRequest) returns (OpenCabinetTabsResponse);

}

message OpenCabinetTabsRequest {
  string session_id = 1;
  repeated string ad_account_ids = 2;  // числовые id без префикса act_
}

message OpenCabinetTabsResponse {
  repeated CabinetTabResult results = 1;
}

message CabinetTabResult {
  string ad_account_id = 1;
  bool opened = 2;       // вкладка открыта/найдена
  string url = 3;        // итоговый URL вкладки (если opened)
  string error = 4;      // текст ошибки (если не opened)
}

message StartBrowserRequest {
  string vision_x_token = 1;
  string vision_api_url = 2;          // default: http://127.0.0.1:3030
  string vision_profile_id = 3;
  optional string vision_folder_id = 4;
  int32 viewport_width = 5;           // default: 1280
  int32 viewport_height = 6;          // default: 800
}

message StartBrowserResponse {
  string session_id = 1;
  VisionProfile profile = 2;
  string initial_page_url = 3;
}

message VisionProfile {
  string folder_id = 1;
  string profile_id = 2;
  int32 cdp_port = 3;
}

message ReconnectBrowserRequest {
  string session_id = 1;
  // Reconnect is deliberately bound to the immutable credentials/profile
  // registered by StartBrowser. Old callers may still send these field
  // numbers, but proto3 treats them as unknown and the server cannot retarget
  // stored credentials through this ordinary lifecycle RPC.
  reserved 2, 3, 4;
  reserved "vision_x_token", "vision_api_url", "vision_profile_id";
}

message RecoverBrowserProfileRequest {
  string vision_x_token = 1;
  string vision_api_url = 2;
  string vision_profile_id = 3;
  optional string vision_folder_id = 4;
  string maintenance_owner = 5;
  int64 capability_expires_at = 6;
  string capability_nonce = 7;
  string capability_signature = 8;
}
