syntax = "proto3";

package fb_agent.scanner.v1;

service ScannerService {
  // Полный цикл сканирования через am_tabular (graph-канал UI, active replication).
  // Стримит один ScanComplete (DOM-парсинг/скролл выпилены).
  rpc RunScanCycle(RunScanCycleRequest) returns (stream ScanCycleEvent);

  // Найти toggle-ячейку для конкретного объявления (скроллит таблицу).
  rpc FindToggleCell(FindToggleCellRequest) returns (FindToggleCellResponse);

  // Прочитать aria-checked состояние toggle-ячейки.
  rpc ReadToggleState(ReadToggleStateRequest) returns (ReadToggleStateResponse);

  // Переключить on/off switch объявления.
  rpc ToggleAd(ToggleAdRequest) returns (ToggleAdResponse);

  // Human-like движение мыши к координатам.
  rpc HumanMove(HumanMoveRequest) returns (HumanMoveResponse);

  // Human-like клик по координатам.
  rpc HumanClick(HumanClickRequest) returns (HumanClickResponse);

  // Human-like скролл колесом.
  rpc HumanWheelScroll(HumanWheelScrollRequest) returns (HumanWheelScrollResponse);

  // Ждать подтверждения toggle через повторные чтения aria-checked.
  rpc WaitForToggleConfirmation(WaitForToggleConfirmationRequest) returns (WaitForToggleConfirmationResponse);

  // Жёсткая перезагрузка страницы с очисткой кеша (через CDP Network.clearBrowserCache).
  rpc HardReloadPage(HardReloadPageRequest) returns (HardReloadPageResponse);
}

// --- RunScanCycle: streaming RPC ---

message RunScanCycleRequest {
  string session_id = 1;
  optional string page_id = 2;
  int32 max_scroll_passes = 3;      // default: 50
  bool do_refresh = 4;              // default: true
  bool reset_scroll_first = 5;      // default: true
  double settle_delay_seconds = 6;  // wait after refresh
  reserved 7;  // был scan_source — удалён: am_tabular единственный режим, DOM выпилен
  // Allowlist кампаний для am-режима (#3): фильтр am_tabular по campaign.id IN [...].
  // Пусто → без фильтра по кампаниям (owner-scoping остаётся в Python-пайплайне).
  repeated string campaign_ids = 8;
  // Owner-tag для am-режима: если campaign_ids пуст, am сам резолвит campaign.id по имени
  // (campaignMatchesOwner) → тянет сразу только свой скоуп, а не весь кабинет. Пусто → все.
  string owner_tag = 9;
}

message ScanCycleEvent {
  string session_id = 1;
  oneof event {
    ScanProgress progress = 2;
    ScanComplete complete = 3;
    ScanError error = 4;
  }
}

message ScanProgress {
  int32 pass_number = 1;
  int32 rows_so_far = 2;
  ScrollMetrics scroll_metrics = 3;
  repeated ScannedAdRow new_rows = 4;
}

message ScanComplete {
  repeated ScannedAdRow all_rows = 1;
  int32 total_passes = 2;
  double duration_seconds = 3;
  repeated string dismissed_modals = 4;         // id модалок из каталога, которые были закрыты
  repeated string unknown_modal_artifacts = 5;  // пути вида ".logs/modals/..."

  // Тайминги фаз цикла (заполняется browser-agent) — для UI/диагностики.
  PhaseTimings phase_timings = 6;
  // fb_ad_id строк, где какие-то обязательные колонки не дочитались.
  repeated string partial_row_ids = 7;
  // Коды-маркеры аномалий, замеченных в скане. Возможные: "loader_visible_long", "header_missing_columns".
  repeated string warnings = 8;
  // TODO: вынести в enum EmptyReason после стабилизации значений.
  // Возможные значения: "" (есть строки), "no_active_ads", "filter_excludes_all", "table_not_found".
  string empty_reason = 9;
  // Строк, где все критические метрики (impressions/spend/cpm/cpc/ctr) пустые.
  // Используется для детекции STALE_DATA в observer.
  int32 rows_with_all_metrics_empty = 10;
}

message PhaseTimings {
  int32 refresh_ms = 1;
  int32 first_row_ms = 2;
  int32 scroll_ms = 3;
  int32 parse_ms = 4;
  int32 total_ms = 5;
}

message ScanError {
  string message = 1;
  bool recoverable = 2;
  int32 attempt = 3;
}

// --- RefreshTable ---

message RefreshTableRequest {
  string session_id = 1;
  optional string page_id = 2;
}

message RefreshTableResponse {
  bool refreshed = 1;
  bool fallback_reload = 2;
}

// --- ParseVisibleRows ---

message ParseVisibleRowsRequest {
  string session_id = 1;
  optional string page_id = 2;
}

message ParseVisibleRowsResponse {
  repeated ScannedAdRow rows = 1;
}

// --- ScrollAndParse ---

message ScrollAndParseRequest {
  string session_id = 1;
  optional string page_id = 2;
  int32 scroll_amount = 3;          // pixels (default: random 160-260)
  bool wait_for_stable = 4;
  double stable_timeout_seconds = 5;
}

message ScrollAndParseResponse {
  repeated ScannedAdRow new_rows = 1;
  ScrollMetrics scroll_metrics = 2;
  bool at_bottom = 3;
}

// --- WaitForDomStable ---

message WaitForDomStableRequest {
  string session_id = 1;
  optional string page_id = 2;
  double timeout_seconds = 3;       // default: 2.0
  double poll_interval_seconds = 4; // default: 0.1
}

message WaitForDomStableResponse {
  bool stabilized = 1;
  int32 final_row_count = 2;
}

// --- ResetScroll ---

message ResetScrollRequest {
  string session_id = 1;
  optional string page_id = 2;
}

message ResetScrollResponse {
  int32 containers_reset = 1;
}

// --- GetScrollMetrics ---

message GetScrollMetricsRequest {
  string session_id = 1;
  optional string page_id = 2;
}

message GetScrollMetricsResponse {
  ScrollMetrics metrics = 1;
}

message ScrollMetrics {
  bool found = 1;
  double scroll_top = 2;
  double max_scroll_top = 3;
  bool at_bottom = 4;
}

// --- GetVisibleRowIds ---

message GetVisibleRowIdsRequest {
  string session_id = 1;
  optional string page_id = 2;
}

message GetVisibleRowIdsResponse {
  repeated string row_ids = 1;
}

// --- FindToggleCell ---

message FindToggleCellRequest {
  string session_id = 1;
  optional string page_id = 2;
  string fb_ad_id = 3;
  int32 max_scroll_passes = 4;      // default: 30
  bool reset_to_top = 5;            // default: true
}

message FindToggleCellResponse {
  bool found = 1;
  double cell_x = 2;
  double cell_y = 3;
  string aria_checked = 4;          // "true" or "false"
}

// --- ReadToggleState ---

message ReadToggleStateRequest {
  string session_id = 1;
  optional string page_id = 2;
  string fb_ad_id = 3;
}

message ReadToggleStateResponse {
  bool found = 1;
  string aria_checked = 2;
}

// --- ToggleAd ---

message ToggleAdRequest {
  string session_id = 1;
  optional string page_id = 2;
  string fb_ad_id = 3;
  bool target_state = 4;            // true = ON, false = OFF
}

message ToggleAdResponse {
  bool success = 1;
  string final_state = 2;
}

// --- HumanMove ---

message HumanMoveRequest {
  string session_id = 1;
  optional string page_id = 2;
  double target_x = 3;
  double target_y = 4;
  optional HumanProfile profile = 5;
}

message HumanMoveResponse {}

// --- HumanClick ---

message HumanClickRequest {
  string session_id = 1;
  optional string page_id = 2;
  double x = 3;
  double y = 4;
  bool double_check_pause = 5;      // default: true
  optional HumanProfile profile = 6;
}

message HumanClickResponse {}

// --- HumanWheelScroll ---

message HumanWheelScrollRequest {
  string session_id = 1;
  optional string page_id = 2;
  int32 delta_y = 3;                // positive = down, negative = up
  optional double anchor_x = 4;
  optional double anchor_y = 5;
  optional HumanProfile profile = 6;
}

message HumanWheelScrollResponse {
  double final_x = 1;
  double final_y = 2;
}

// --- WaitForToggleConfirmation ---

message WaitForToggleConfirmationRequest {
  string session_id = 1;
  optional string page_id = 2;
  string fb_ad_id = 3;
  string expected_checked = 4;
  int32 required_reads = 5;
  repeated double poll_delays_seconds = 6;
  int32 max_scroll_passes_restore = 7;
}

message WaitForToggleConfirmationResponse {
  bool success = 1;
  string message = 2;
  string final_aria_checked = 3;
  int32 reads_matched = 4;
}

// --- ScannedAdRow: зеркало Python dataclass, Decimal как string ---

message ScannedAdRow {
  string fb_ad_id = 1;
  string campaign_name = 2;
  string adset_name = 3;
  string ad_name = 4;
  string delivery_status = 5;
  string spend = 6;
  string budget = 7;
  int32 reach = 8;
  int32 impressions = 9;
  int32 clicks = 10;
  string cpc = 11;
  string ctr = 12;
  int32 outbound_clicks = 13;
  string outbound_ctr = 14;
  int32 landing_page_views = 15;
  string cost_per_landing_page_view = 16;
  string cost_per_result = 17;
  string cpm = 18;
  string frequency = 19;
  int32 leads = 20;
  string cost_per_lead = 21;
  int32 registrations = 22;
  string cost_per_registration = 23;
  int32 deposits = 24;
  string resolved_offer_code = 25;
  string campaign_id = 26;
}

// --- HardReloadPage ---

message HardReloadPageRequest {
  string session_id = 1;
  optional string page_id = 2;
  bool bypass_cache = 3;
}

message HardReloadPageResponse {
  bool success = 1;
  string error_message = 2;
  int32 reload_ms = 3;
}

// --- HumanProfile: сессионный "почерк" ---

message HumanProfile {
  double speed_factor = 1;          // default: random 0.7-1.4
  double jitter_factor = 2;         // default: random 0.6-1.5
  double pause_factor = 3;          // default: random 0.7-1.3
  double overshoot_chance = 4;      // default: random 0.10-0.30
  double idle_chance = 5;           // default: random 0.02-0.08
  double idle_duration_min = 6;     // default: random 1.5-2.5
  double idle_duration_max = 7;     // default: random 4.0-6.0
  int32 bezier_steps_min = 8;       // default: random 18-24
  int32 bezier_steps_max = 9;       // default: random 30-40
}
