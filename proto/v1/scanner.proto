syntax = "proto3";

package fb_agent.scanner.v1;

service ScannerService {
  // Полный цикл сканирования через am_tabular (graph-канал UI, active replication).
  // Стримит один ScanComplete (DOM-парсинг/скролл выпилены).
  rpc RunScanCycle(RunScanCycleRequest) returns (stream ScanCycleEvent);

  // Жёсткая перезагрузка страницы с очисткой кеша (через CDP Network.clearBrowserCache).
  rpc HardReloadPage(HardReloadPageRequest) returns (HardReloadPageResponse);

  // Live-список кампаний по owner_tag (через Graph campaigns edge, МИМО allowlist).
  // Для UI «Кампании для сканирования»: показывает ВСЕ кампании владельца, включая
  // новые, которые ещё не сканировались (allowlist их не пропускал бы в обычный скан).
  rpc ListCampaigns(ListCampaignsRequest) returns (ListCampaignsResponse);
}

// Отключение/включение рекламы выполняется ТОЛЬКО через Marketing API
// (MetaApiService.ExecuteGraphCall → pause_ad/activate_ad). DOM-toggle канал
// (ToggleAd/FindToggleCell/ReadToggleState/WaitForToggleConfirmation + Human*-мышь)
// удалён вместе с реализацией в browser-agent — он промахивался по кнопке/скроллу.

// --- ListCampaigns ---

message ListCampaignsRequest {
  string session_id = 1;
  optional string page_id = 2;
  // Фильтр по owner-тегу (campaignMatchesOwner). Пусто → все кампании кабинета.
  string owner_tag = 3;
  // Мульти-кабинет (L10): числовой ID кабинета (без префикса act_), вкладку которого
  // нужно открыть для резолва кампаний (ensureAdsManagerPage({actId})). Пусто → старое
  // поведение (текущая primary-вкладка). Симметрично RunScanCycleRequest.ad_account_id.
  string ad_account_id = 4;
}

message CampaignInfo {
  string id = 1;
  string name = 2;
}

message ListCampaignsResponse {
  repeated CampaignInfo campaigns = 1;
}

// --- RunScanCycle: streaming RPC ---

message RunScanCycleRequest {
  string session_id = 1;
  optional string page_id = 2;
  int32 max_scroll_passes = 3;      // default: 50
  bool do_refresh = 4;              // default: true
  bool reset_scroll_first = 5;      // default: true
  double settle_delay_seconds = 6;  // wait after refresh
  reserved 7;  // был scan_source — удалён: am_tabular единственный режим, DOM выпилен
  // Allowlist кампаний для am-режима (#3): фильтр am_tabular по campaign.id IN [...].
  // Пусто → без фильтра по кампаниям (owner-scoping остаётся в Python-пайплайне).
  repeated string campaign_ids = 8;
  // Owner-tag для am-режима: если campaign_ids пуст, am сам резолвит campaign.id по имени
  // (campaignMatchesOwner) → тянет сразу только свой скоуп, а не весь кабинет. Пусто → все.
  string owner_tag = 9;
  // Мульти-кабинет (MULTI_CABINET_PLAN.md): числовой ID кабинета (без префикса act_),
  // который нужно сканировать. browser-agent находит/открывает вкладку этого кабинета
  // и сверяет act из GraphContext. Пусто → старое поведение (текущая primary-вкладка).
  string ad_account_id = 10;
}

message ScanCycleEvent {
  string session_id = 1;
  oneof event {
    ScanProgress progress = 2;
    ScanComplete complete = 3;
    ScanError error = 4;
  }
}

message ScanProgress {
  int32 pass_number = 1;
  int32 rows_so_far = 2;
  ScrollMetrics scroll_metrics = 3;
  repeated ScannedAdRow new_rows = 4;
}

message ScanComplete {
  repeated ScannedAdRow all_rows = 1;
  int32 total_passes = 2;
  double duration_seconds = 3;
  repeated string dismissed_modals = 4;         // id модалок из каталога, которые были закрыты
  repeated string unknown_modal_artifacts = 5;  // пути вида ".logs/modals/..."

  // Тайминги фаз цикла (заполняется browser-agent) — для UI/диагностики.
  PhaseTimings phase_timings = 6;
  // fb_ad_id строк, где какие-то обязательные колонки не дочитались.
  repeated string partial_row_ids = 7;
  // Коды-маркеры аномалий, замеченных в скане. Возможные: "loader_visible_long", "header_missing_columns".
  repeated string warnings = 8;
  // TODO: вынести в enum EmptyReason после стабилизации значений.
  // Возможные значения: "" (есть строки), "no_active_ads", "filter_excludes_all", "table_not_found".
  string empty_reason = 9;
  // Строк, где все критические метрики (impressions/spend/cpm/cpc/ctr) пустые.
  // Используется для детекции STALE_DATA в observer.
  int32 rows_with_all_metrics_empty = 10;
}

message PhaseTimings {
  int32 refresh_ms = 1;
  int32 first_row_ms = 2;
  int32 scroll_ms = 3;
  int32 parse_ms = 4;
  int32 total_ms = 5;
}

message ScanError {
  string message = 1;
  bool recoverable = 2;
  int32 attempt = 3;
}

// ScrollMetrics — телеметрия скролла в ScanProgress (at_bottom для прогресс-индикатора).
message ScrollMetrics {
  bool found = 1;
  double scroll_top = 2;
  double max_scroll_top = 3;
  bool at_bottom = 4;
}

// --- ScannedAdRow: зеркало Python dataclass, Decimal как string ---

message ScannedAdRow {
  string fb_ad_id = 1;
  string campaign_name = 2;
  string adset_name = 3;
  string ad_name = 4;
  string delivery_status = 5;
  string spend = 6;
  string budget = 7;
  int32 reach = 8;
  int32 impressions = 9;
  int32 clicks = 10;
  string cpc = 11;
  string ctr = 12;
  int32 outbound_clicks = 13;
  string outbound_ctr = 14;
  int32 landing_page_views = 15;
  string cost_per_landing_page_view = 16;
  string cost_per_result = 17;
  string cpm = 18;
  string frequency = 19;
  int32 leads = 20;
  string cost_per_lead = 21;
  int32 registrations = 22;
  string cost_per_registration = 23;
  int32 deposits = 24;
  string resolved_offer_code = 25;
  string campaign_id = 26;
  string creative_thumb_url = 27;       // превью крео (thumbnail_url; любой тип крео)
  string creative_image_url = 28;       // полноразмер (image_url; только image-крео, пусто для видео)
  string adset_pixel_id = 29;           // promoted_object.pixel_id адсета
  string adset_daily_budget = 30;       // daily_budget адсета (minor units, как отдаёт Meta)
  string adset_lifetime_budget = 31;    // lifetime_budget адсета
  string adset_budget_remaining = 32;   // budget_remaining адсета
  string adset_learning_stage = 33;     // learning_stage_info.status (LEARNING/LEARNING_LIMITED/"")
}

// --- HardReloadPage ---

message HardReloadPageRequest {
  string session_id = 1;
  optional string page_id = 2;
  bool bypass_cache = 3;
}

message HardReloadPageResponse {
  bool success = 1;
  string error_message = 2;
  int32 reload_ms = 3;
}
