syntax = "proto3";

package fb_agent.meta_api.v1;

// MetaApiService — мост к Marketing API через активную Vision-сессию.
//
// Архитектурная заметка: вызовы Marketing API НЕ исполняются standalone из Python,
// потому что EAAB-токены Ads Manager привязаны к browser session (machine_id, datr cookie,
// fingerprint). Anti-fraud Meta отвергает любые server-to-server вызовы с этими токенами.
// Поэтому весь Marketing API проходит ЧЕРЕЗ Playwright-страницу: browser-agent делает
// page.evaluate(fetch(...)) — запрос идёт из того же session-context, что и DOM-парсинг.
service MetaApiService {
  // Универсальный wrapper. Исполняет произвольный Graph API endpoint
  // изнутри активной браузерной сессии Ads Manager.
  //
  // Path формат: "/me", "/act_XXX/insights", "/{ad_id}", "/{campaign_id}/copies" и т.д.
  // Параметры в query_params, тело в body_json.
  // access_token подставляется автоматически из page source.
  rpc ExecuteGraphCall(ExecuteGraphCallRequest) returns (ExecuteGraphCallResponse);

  // Проверить готовность Marketing API канала: жива ли Vision-сессия,
  // на правильной ли странице (Ads Manager), извлекается ли токен.
  // Лёгкий запрос — используется в health_watchdog для мониторинга.
  rpc CheckMetaApiHealth(CheckMetaApiHealthRequest) returns (CheckMetaApiHealthResponse);

  // Загрузка картинки в /act_X/adimages — single-shot multipart upload.
  // Возвращает image_hash, который потом используется в AdCreative.object_story_spec.
  // Подходит для файлов до ~8MB. Графический контент должен быть JPEG/PNG/GIF.
  rpc UploadImage(UploadImageRequest) returns (UploadImageResponse);

  // Chunked загрузка видео через resumable upload протокол.
  // Клиент шлёт первый чанк с filename+file_size (фаза start),
  // последующие чанки только с bytes (фаза transfer), последний chunk
  // помечается флагом is_last_chunk=true → browser-agent делает фазу finish.
  // Возвращает video_id для AdCreative.object_story_spec.
  rpc UploadVideo(stream UploadVideoChunk) returns (UploadVideoResponse);
}

message ExecuteGraphCallRequest {
  // ID активной browser-сессии. Если пустой — используется preferred session.
  string session_id = 1;

  // HTTP метод: "GET", "POST", "DELETE". Регистронезависимо.
  string method = 2;

  // Endpoint path БЕЗ host и БЕЗ API version. Примеры: "/me", "/act_123/insights".
  // Версия API подставляется browser-agent'ом (см. constant META_API_VERSION).
  string endpoint = 3;

  // Query-параметры (для GET) или form-параметры (для POST).
  // Значения сериализуются как строки; arrays/objects надо передавать
  // как JSON-строки на стороне вызывающего.
  map<string, string> query_params = 4;

  // JSON-тело запроса для POST/PUT (опционально).
  // Если задано — устанавливается Content-Type: application/json.
  string body_json = 5;

  // Таймаут запроса в миллисекундах (по умолчанию 30_000 в browser-agent).
  optional int32 timeout_ms = 6;
}

message ExecuteGraphCallResponse {
  // HTTP статус код Meta API (200, 400, 403, и т.д.).
  int32 status_code = 1;

  // JSON-ответ Meta API целиком (как строка для сохранения структуры,
  // включая вложенные объекты, массивы, decimal-числа).
  string response_json = 2;

  // Длительность запроса в миллисекундах (для аудита и rate-limit мониторинга).
  int32 duration_ms = 3;

  // Если ответ Meta содержит блок "error" — заполняется для удобства client'а.
  optional GraphApiError error = 4;
}

message GraphApiError {
  // Meta error code (1 = generic, 190 = token invalidated, 17 = rate limit, ...).
  int32 code = 1;

  // Meta error subcode (более специфичный, например 463 для checkpoint).
  int32 subcode = 2;

  // Тип ошибки: "OAuthException", "GraphMethodException", "FacebookApiException".
  string type = 3;

  // Текст ошибки от Meta.
  string message = 4;

  // fbtrace_id для дебага (можно искать в Meta для деталей).
  string fbtrace_id = 5;
}

message CheckMetaApiHealthRequest {
  // ID активной browser-сессии. Если пустой — используется preferred session.
  string session_id = 1;
}

message CheckMetaApiHealthResponse {
  // True если Vision-сессия активна И на странице есть access_token.
  bool healthy = 1;

  // Текущий URL страницы (чтобы понять, на Ads Manager ли мы).
  string current_url = 2;

  // True если в page source найден EAA-токен (Marketing API доступен).
  bool token_present = 3;

  // Длина найденного токена (для логирования; сам токен не передаём из соображений безопасности).
  int32 token_length = 4;

  // Детали при unhealthy: "session_not_found", "page_closed", "wrong_url",
  // "token_not_found", "browser_disconnected".
  string detail = 5;
}

// ======================== Media upload ========================

message UploadImageRequest {
  // ID активной browser-сессии. Если пустой — preferred session.
  string session_id = 1;

  // Ad account ID с префиксом "act_". Картинка цепляется к этому аккаунту.
  string ad_account_id = 2;

  // Имя файла (нужно для form-data поля filename и для определения расширения).
  string filename = 3;

  // MIME-тип (image/jpeg, image/png, image/gif). Используется в multipart.
  string content_type = 4;

  // Бинарные данные файла целиком. Single-shot — ограничено max gRPC сообщением (~50MB).
  bytes file_bytes = 5;

  // Альтернатива file_bytes: URL откуда Meta сама скачает картинку.
  // Если задан — file_bytes игнорируется; multipart не отправляется.
  // Должен быть HTTPS. Используется для источников в S3/CDN.
  string image_url = 6;

  // Имя картинки для Meta (при URL-загрузке). Если пустое — Meta назначает сама.
  string name = 7;
}

message UploadImageResponse {
  // Image hash возвращённый Meta — основной идентификатор для creative.
  // Длинная hex-строка вроде "fae7...d92".
  string image_hash = 1;

  // True если загрузка успешна. False — смотреть error.
  bool ok = 2;

  // Текст ошибки если ok=false (Graph error, network, etc).
  string error = 3;

  // URL картинки в Meta CDN (опционально, иногда возвращается).
  string url = 4;

  // Длительность загрузки в миллисекундах.
  int32 duration_ms = 5;
}

message UploadVideoChunk {
  // ID активной browser-сессии. Заполняется ТОЛЬКО в первом чанке (init).
  string session_id = 1;

  // Ad account ID с префиксом "act_". ТОЛЬКО в первом чанке.
  string ad_account_id = 2;

  // Имя файла. ТОЛЬКО в первом чанке.
  string filename = 3;

  // Полный размер файла в байтах. ТОЛЬКО в первом чанке — нужен для фазы start.
  int64 file_size = 4;

  // Бинарные данные текущего чанка. Может быть пустым в первом init-чанке если is_init=true.
  bytes chunk_bytes = 5;

  // Порядковый номер чанка (0-based). Для логирования и диагностики.
  int32 chunk_index = 6;

  // True для последнего чанка — browser-agent после transfer делает фазу finish.
  bool is_last_chunk = 7;

  // True если это init-only chunk (только метаданные, без bytes).
  // Полезно когда удобнее отделить init от первого transfer-чанка.
  bool is_init = 8;
}

message UploadVideoResponse {
  // Video ID возвращённый Meta после фазы finish.
  string video_id = 1;

  // True если загрузка успешна. False — смотреть error.
  bool ok = 2;

  // Текст ошибки если ok=false.
  string error = 3;

  // Полное время загрузки видео (start + все transfer + finish) в миллисекундах.
  int32 duration_ms = 4;

  // Сколько чанков было обработано — для логирования.
  int32 chunks_processed = 5;
}
