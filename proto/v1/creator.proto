syntax = "proto3";

package fb_agent.creator.v1;

// Сервис создания FB-кампаний: выполнение планов и запись новых через recorder.
// Работает поверх browser-agent-сессии (см. browser_session.proto).
service CreatorService {
  // Выполнить план: стримит события каждого шага (started/finished/failed/skipped)
  // плюс финальный complete с итоговым статусом.
  rpc RunPlan(RunPlanRequest) returns (stream PlanEvent);

  // Начать запись действий пользователя в Plan-формате. Возвращается сразу,
  // recorder работает в браузере до StopRecording.
  rpc StartRecording(StartRecordingRequest) returns (StartRecordingResponse);

  // Остановить запись и вернуть собранный Plan (JSON-строка).
  rpc StopRecording(StopRecordingRequest) returns (StopRecordingResponse);

  // Получить текущее состояние recorder (для UI/polling). Не останавливает.
  rpc GetRecorderStatus(GetRecorderStatusRequest) returns (GetRecorderStatusResponse);
}

// --- RunPlan ---

message RunPlanRequest {
  string session_id = 1;
  optional string page_id = 2;
  // Plan как JSON-строка: { schema_version, steps: [{step, input}, ...] }
  string plan_json = 3;
  // Переменные для подстановки {{var}} в input шагов.
  string variables_json = 4;
}

message PlanEvent {
  oneof event {
    StepStarted started = 1;
    StepFinished finished = 2;
    StepFailed failed = 3;
    StepSkipped skipped = 4;
    PlanComplete complete = 5;
    CheckpointDetected checkpoint = 6;
  }
}

message StepStarted {
  string step = 1;
  int32 index = 2;
  int64 timestamp_ms = 3;
}

message StepFinished {
  string step = 1;
  int32 index = 2;
  int64 timestamp_ms = 3;
  // Произвольная детализация (JSON-строка).
  string detail_json = 4;
}

message StepFailed {
  string step = 1;
  int32 index = 2;
  string error = 3;
  int64 timestamp_ms = 4;
}

message StepSkipped {
  string step = 1;
  int32 index = 2;
  string reason = 3;
  int64 timestamp_ms = 4;
}

message PlanComplete {
  bool ok = 1;
  string error = 2;
  int32 total_steps = 3;
  int64 duration_ms = 4;
}

// Сигнал что FB показал /checkpoint/ или иной экран, требующий внимания.
message CheckpointDetected {
  string url = 1;
  string detail = 2;
}

// --- Recorder ---

message StartRecordingRequest {
  string session_id = 1;
  optional string page_id = 2;
  string plan_name = 3;
}

message StartRecordingResponse {
  bool started = 1;
  string message = 2;
}

message StopRecordingRequest {
  string session_id = 1;
  optional string page_id = 2;
}

message StopRecordingResponse {
  bool stopped = 1;
  // Собранный план как JSON-строка.
  string plan_json = 2;
  int32 recorded_steps = 3;
}

message GetRecorderStatusRequest {
  string session_id = 1;
  optional string page_id = 2;
}

message GetRecorderStatusResponse {
  bool recording = 1;
  string plan_name = 2;
  int32 recorded_steps = 3;
}
