[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-stop-bot"
version = "0.1.0"
description = "Бот для мониторинга и остановки объявлений Facebook Ads"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "itsdangerous>=2.2.0,<3.0.0",
  "alembic>=1.14.1,<2.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "patchright>=1.52.0,<2.0.0",
  # "rebrowser-patches>=0.5.0",  # пакет удалён из PyPI
  "pydantic-settings>=2.8.0,<3.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "python-json-logger>=3.3.0,<4.0.0",
  "pillow>=11.0.0,<12.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "sqlalchemy>=2.0.38,<3.0.0",
  "tenacity>=9.0.0,<10.0.0",
  "supervisor>=4.2.0,<5.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "cryptography>=44.0.0,<45.0.0",
  "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
  "structlog>=24.0,<27.0",
  "grpcio>=1.80.0,<2.0.0",
  "protobuf>=6.31.1,<7.0.0",
  "redis>=5.0,<6.0",
  "prometheus_client>=0.20",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0,<1.0.0",
  "fakeredis>=2.0,<3.0",
  "pytest>=8.3.5,<9.0.0",
  "pytest-asyncio>=0.25.3,<1.0.0",
  "ruff>=0.11.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Глобальный таймаут на любой тест — чтобы зависшие сразу падали, а не висели часами.
timeout = 5
timeout_method = "thread"
filterwarnings = [
  'ignore:.*asyncio.get_event_loop_policy.*:DeprecationWarning:pytest_asyncio.plugin',
  'ignore:.*asyncio.set_event_loop_policy.*:DeprecationWarning:pytest_asyncio.plugin',
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"run_*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "pytest.*",
  "pytest_asyncio.*",
  "tenacity.*",
  "alembic.*",
  "uvicorn.*",
  "playwright.*",
  "patchright.*",
  "sentry_sdk.*",
]
ignore_missing_imports = true
