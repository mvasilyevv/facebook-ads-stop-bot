[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-stop-bot"
version = "0.1.0"
description = "Бот для мониторинга и остановки объявлений Facebook Ads"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "itsdangerous>=2.2.0,<3.0.0",
  "alembic>=1.14.1,<2.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "patchright>=1.52.0,<2.0.0",
  # "rebrowser-patches>=0.5.0",  # пакет удалён из PyPI
  "pydantic-settings>=2.8.0,<3.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "python-json-logger>=3.3.0,<4.0.0",
  "pillow>=11.0.0,<12.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "sqlalchemy>=2.0.38,<3.0.0",
  "tenacity>=9.0.0,<10.0.0",
  "supervisor>=4.2.0,<5.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "cryptography>=44.0.0,<45.0.0",
  "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
  "structlog>=24.0,<27.0",
  "grpcio>=1.80.0,<2.0.0",
  "protobuf>=6.31.1,<7.0.0",
  "redis>=5.0,<6.0",
  "prometheus_client>=0.20",
  "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0,<1.0.0",
  "fakeredis>=2.0,<3.0",
  # Регенерация gRPC-стабов (make proto-compile / run.sh): версия в одной линии с grpcio.
  "grpcio-tools>=1.80.0,<2.0.0",
  "pytest>=8.3.5,<9.0.0",
  "pytest-asyncio>=0.25.3,<1.0.0",
  "pytest-timeout>=2.4.0,<3.0",
  "respx>=0.21.0,<1.0",
  "ruff>=0.11.0,<1.0.0",
  "hypothesis>=6.0,<7.0",
  # core/campaign_creator/* импортит playwright.async_api top-level (~28 модулей);
  # тесты (test_humanizer, test_campaign_name) их собирают → нужен для CI-сбора.
  # В проде не нужен (creator не активен; воркеры используют patchright).
  "playwright>=1.52.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Глобальный таймаут на любой тест — чтобы зависшие сразу падали, а не висели часами.
timeout = 5
timeout_method = "thread"
filterwarnings = [
  'ignore:.*asyncio.get_event_loop_policy.*:DeprecationWarning:pytest_asyncio.plugin',
  'ignore:.*asyncio.set_event_loop_policy.*:DeprecationWarning:pytest_asyncio.plugin',
]
markers = [
  "live: hit a real external service (off by default; run with `pytest -m live`).",
]
# Live-тесты бьют по внешним сервисам — по умолчанию исключены, чтобы CI и
# локальный `pytest` не делали реальных HTTP-запросов. Запуск отдельно:
#   pytest -m live --override-ini="addopts="
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
# Исключаем из линтинга код, который не поддерживаем вручную:
# - clients/python_grpc/v1 — gRPC-стабы, генерируются protoc (F401/I001 неизбежны;
#   CI регенерирует их перед ruff → линтинг их всегда ронял, ломая весь pipeline).
# - scripts/recon_*, overlay_captions — разведочные one-off скрипты, не прод-код.
extend-exclude = [
    "clients/python_grpc/v1",
    "scripts/recon_adlib.py",
    "scripts/recon_diag.py",
    "scripts/recon_video.py",
    "scripts/recon_video2.py",
    "scripts/recon_video_v2.py",
    "scripts/recon_video_v3.py",
    "scripts/overlay_captions.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"run_*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "pytest.*",
  "pytest_asyncio.*",
  "tenacity.*",
  "alembic.*",
  "uvicorn.*",
  "playwright.*",
  "patchright.*",
  "sentry_sdk.*",
]
ignore_missing_imports = true
