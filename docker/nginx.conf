# Nginx конфигурация для React SPA с проксированием API
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip-сжатие для статики
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Кэширование статических ассетов (хэшированные имена файлов Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Проксирование API-запросов на backend.
    # resolver + переменная upstream → nginx резолвит IP api ПЕР-ЗАПРОС (docker DNS
    # 127.0.0.11), а не один раз при старте. Иначе после пересоздания api (rebuild)
    # nginx держит старый IP и отдаёт 502, пока его не перезапустят.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream api;
        # БЕЗ trailing slash — не срезаем префикс /api: роутеры API зарегистрированы
        # под /api/* (register_all prefix=/api). С переменной nginx передаёт полный URI.
        proxy_pass http://$api_upstream:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback: все незнакомые пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
