# Nginx конфигурация для React SPA с проксированием API
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip-сжатие для статики
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Кэширование статических ассетов (хэшированные имена файлов Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Проксирование API-запросов на backend
    location /api/ {
        proxy_pass http://fb-stop-bot-api:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback: все незнакомые пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
