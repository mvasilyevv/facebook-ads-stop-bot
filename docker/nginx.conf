# Nginx конфигурация для React SPA с проксированием API
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip-сжатие для статики
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Кэширование статических ассетов (хэшированные имена файлов Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML must always be revalidated after a release. Hashed assets remain
    # immutable, but a cached index.html can otherwise point at removed chunks.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Проксирование API-запросов на backend.
    # resolver + переменная upstream → nginx резолвит IP api ПЕР-ЗАПРОС (docker DNS
    # 127.0.0.11), а не один раз при старте. Иначе после пересоздания api (rebuild)
    # nginx держит старый IP и отдаёт 502, пока его не перезапустят.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream api;
        # БЕЗ trailing slash — не срезаем префикс /api: роутеры API зарегистрированы
        # под /api/* (register_all prefix=/api). С переменной nginx передаёт полный URI.
        proxy_pass http://$api_upstream:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Загрузка концептов (campaigns/upload) — видео до 500MB. Дефолт nginx 1MB
        # отбивал бы 413 ещё до backend (у которого свой стримовый лимит 500MB).
        client_max_body_size 512m;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        # Стримим тело в backend, не буферизуя весь файл на диск nginx.
        proxy_request_buffering off;
    }

    # WebSocket /ws/* → backend (live-обновления дашборда). Без этого блока WS-запрос
    # уходил в SPA-fallback (index.html) и апгрейд не проходил → фронт жил на polling.
    # Нужны HTTP/1.1 + Upgrade/Connection-заголовки. resolver+переменная — per-request DNS api
    # (как у /api). Длинный read/send timeout — WS долгоживущий, не рвать соединение.
    location /ws/ {
        resolver 127.0.0.11 valid=10s;
        set $ws_upstream api;
        proxy_pass http://$ws_upstream:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: все незнакомые пути → index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
