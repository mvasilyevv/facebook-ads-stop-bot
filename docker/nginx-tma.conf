# Nginx конфигурация для Telegram Mini App (base path /tma/)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Кэширование статических ассетов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Проксирование API-запросов на backend.
    # resolver + переменная upstream → per-запрос DNS api (docker 127.0.0.11), иначе
    # после пересоздания api nginx держит старый IP → 502 до рестарта контейнера.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream api;
        # БЕЗ trailing slash — не срезаем префикс /api: роутеры API под /api/*.
        proxy_pass http://$api_upstream:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Загрузка концептов (campaigns/upload) — видео до 500MB (дефолт nginx 1MB → 413).
        client_max_body_size 512m;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
    }

    # WebSocket /ws/* → backend (live-обновления). Без upgrade-заголовков WS не апгрейдится.
    location /ws/ {
        resolver 127.0.0.11 valid=10s;
        set $ws_upstream api;
        proxy_pass http://$ws_upstream:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback для пути /tma/
    location /tma/ {
        try_files $uri $uri/ /tma/index.html;
    }

    # Редирект с корня на /tma/
    location = / {
        return 301 /tma/;
    }
}
