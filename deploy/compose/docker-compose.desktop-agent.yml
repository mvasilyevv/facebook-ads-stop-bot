# Browser-agent lifecycle is independent from the application plane.
# It intentionally shares Vision's network namespace so Vision API and dynamic
# CDP ports remain loopback-only.

name: fb_agent_desktop

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-desktop-labels: &desktop-labels
  com.fb-agent.managed: "true"
  com.fb-agent.cluster-id: ${FB_AGENT_BOOTSTRAP_CLUSTER_ID:?set FB_AGENT_BOOTSTRAP_CLUSTER_ID}
  com.fb-agent.purpose: vision
  com.fb-agent.release: ${RELEASE_ID:?set RELEASE_ID}

services:
  vision-webtop:
    image: ${DESKTOP_WEBTOP_IMAGE:?set DESKTOP_WEBTOP_IMAGE to image@sha256}
    restart: unless-stopped
    init: true
    shm_size: 2gb
    env_file: ${DESKTOP_ENV_FILE:?set DESKTOP_ENV_FILE}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Kaliningrad}
    ports:
      - "127.0.0.1:${BROWSER_GRPC_HOST_PORT:?set BROWSER_GRPC_HOST_PORT}:50051"
    volumes:
      - ${VISION_CONFIG_DIR:?set VISION_CONFIG_DIR}:/config
      # Сюда стол публикует ID канала RustDesk; операторский API читает его
      # и показывает на странице «Рабочий стол». Секретов здесь нет.
      - ${DESKTOP_READINESS_DIR:?set DESKTOP_READINESS_DIR}:/run/desktop-readiness
      # Публичный ключ брокера стол читает из его каталога: пару генерирует
      # сам брокер при первом старте, секрет для этого не нужен.
      - ${DESKTOP_RUSTDESK_DATA_DIR:?set DESKTOP_RUSTDESK_DATA_DIR}:/run/rustdesk-broker:ro
    networks:
      platform:
        aliases: [vision-webtop]
    logging: *logging
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    labels:
      <<: *desktop-labels
      com.fb-agent.service: vision-webtop

  browser-agent:
    image: ${BROWSER_AGENT_IMAGE:?set BROWSER_AGENT_IMAGE to image@sha256}
    restart: unless-stopped
    init: true
    env_file:
      - ${BROWSER_CONTROL_ENV_FILE:?set BROWSER_CONTROL_ENV_FILE}
    environment:
      GRPC_PORT: "50051"
      WORKER_METRICS_PORT: "9464"
      BROWSER_AUTHORITY_CONSUME_URL: ${BROWSER_AUTHORITY_CONSUME_URL:?set BROWSER_AUTHORITY_CONSUME_URL}
      BROWSER_MAINTENANCE_CONSUME_URL: ${BROWSER_MAINTENANCE_CONSUME_URL:?set BROWSER_MAINTENANCE_CONSUME_URL}
      BROWSER_AGENT_AM_COLUMNS_QS: ${BROWSER_AGENT_AM_COLUMNS_QS:-}
    network_mode: "service:vision-webtop"
    depends_on:
      vision-webtop:
        condition: service_healthy
    logging: *logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const n=require('net').connect(50051,'127.0.0.1');n.on('connect',()=>{n.end();process.exit(0)});n.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      <<: *desktop-labels
      com.fb-agent.service: browser-agent
      # The process shares Vision's network namespace, so Docker discovery has
      # no container IP for this label. Alloy uses the explicit
      # vision-webtop:9464 target declared in its host-agent configuration.
      com.fb-agent.metrics: "true"
      com.fb-agent.metrics.address: vision-webtop
      com.fb-agent.metrics.port: "9464"

  # Собственный брокер RustDesk. Нужен, чтобы нативный канал к столу не ходил
  # через публичные серверы rustdesk.com: проверено на живом контейнере —
  # клиент по умолчанию регистрируется именно там. Для машины с открытым
  # кабинетом чужой посредник в схеме лишний, даже при сквозном шифровании.
  #
  # Наружу смотрит только брокер и только по адресу, который задал владелец.
  # Сам рабочий стол портов в интернет не открывает.
  rustdesk-id:
    image: ${DESKTOP_RUSTDESK_SERVER_IMAGE:-rustdesk/rustdesk-server:1.1.14}
    command: hbbs
    restart: unless-stopped
    init: true
    ports:
      - "${DESKTOP_RUSTDESK_BIND:-127.0.0.1}:21115:21115"
      - "${DESKTOP_RUSTDESK_BIND:-127.0.0.1}:21116:21116"
      - "${DESKTOP_RUSTDESK_BIND:-127.0.0.1}:21116:21116/udp"
    volumes:
      # Пара ключей брокера обязана пережить пересоздание контейнера: после
      # смены ключа все клиенты перестают ему верить и требуют перенастройки.
      - ${DESKTOP_RUSTDESK_DATA_DIR:?set DESKTOP_RUSTDESK_DATA_DIR}:/root
    networks:
      platform:
        aliases: [rustdesk-id]
    logging: *logging
    security_opt:
      - no-new-privileges:true
    labels:
      <<: *desktop-labels
      com.fb-agent.service: rustdesk-id

  rustdesk-relay:
    image: ${DESKTOP_RUSTDESK_SERVER_IMAGE:-rustdesk/rustdesk-server:1.1.14}
    command: hbbr
    restart: unless-stopped
    init: true
    ports:
      - "${DESKTOP_RUSTDESK_BIND:-127.0.0.1}:21117:21117"
    volumes:
      - ${DESKTOP_RUSTDESK_DATA_DIR:?set DESKTOP_RUSTDESK_DATA_DIR}:/root
    networks:
      platform:
        aliases: [rustdesk-relay]
    logging: *logging
    security_opt:
      - no-new-privileges:true
    labels:
      <<: *desktop-labels
      com.fb-agent.service: rustdesk-relay

networks:
  platform:
    name: ${PLATFORM_NETWORK:?set PLATFORM_NETWORK}
    external: true
