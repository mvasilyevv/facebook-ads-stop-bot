# Durable data plane.  Start exactly one project (`fb_agent_infra`) and keep it
# alive while blue/green application projects are replaced.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-inventory-labels: &inventory-labels
  com.fb-agent.managed: "true"
  com.fb-agent.cluster-id: ${FB_AGENT_BOOTSTRAP_CLUSTER_ID:?set FB_AGENT_BOOTSTRAP_CLUSTER_ID}
  com.fb-agent.purpose: infra

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to image@sha256}
    restart: unless-stopped
    init: true
    logging: *logging
    mem_limit: 1g
    oom_score_adj: -700
    env_file:
      - ${APP_ENV_FILE:?set APP_ENV_FILE}
      - ${BACKUP_ENV_FILE:?set BACKUP_ENV_FILE}
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=fb-agent archive-push %p
      - -c
      - archive_timeout=300
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackrest_spool:/var/spool/pgbackrest
      # This bind source lives in durable shared state, never in a release
      # directory that retention may prune while PostgreSQL is still running.
      - ${PGBACKREST_CONFIG_FILE:?set PGBACKREST_CONFIG_FILE}:/etc/pgbackrest/pgbackrest.conf:ro
    networks:
      platform:
        aliases: [postgres]
    labels: *inventory-labels
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE to image@sha256}
    restart: unless-stopped
    init: true
    logging: *logging
    mem_limit: 256m
    oom_score_adj: -500
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    networks:
      platform:
        aliases: [redis]
    labels: *inventory-labels
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  platform:
    name: fb_agent_safety_first_platform
    external: true

volumes:
  pgdata:
    name: fb_agent_safety_first_pgdata
    external: true
  redisdata:
    name: fb_agent_safety_first_redisdata
    external: true
  pgbackrest_spool:
    name: fb_agent_safety_first_pgbackrest_spool
    external: true
