global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Сам Prometheus.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Метрики хоста (CPU, RAM, диск, uptime, сеть, load).
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          node: fb-agent-monitoring-1
          role: monitoring

  # Метрики по каждому docker-контейнеру (CPU/RAM/restarts).
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          node: fb-agent-monitoring-1
          role: monitoring

  # Durable application-host inventory. Each target scrapes Prometheus itself
  # only to maintain an always-present `up` series; all scraped samples are
  # discarded. Removing a retired host from application-hosts.json is the
  # explicit operation that stops missing-host alerts for that node.
  - job_name: expected-application-host
    file_sd_configs:
      - files: ['/etc/prometheus/targets/application-hosts.json']
    metric_relabel_configs:
      - source_labels: ['__name__']
        regex: '.+'
        action: drop

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # Same-host mode.  Off-host application nodes are scraped by Alloy and sent
  # to Prometheus's remote-write receiver with the same job/service labels.
  - job_name: fb-agent-runtime
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_fb_agent_metrics']
        regex: 'true'
        action: keep
      - source_labels:
          - '__meta_docker_network_ip'
          - '__meta_docker_container_label_com_fb_agent_metrics_port'
        separator: ':'
        regex: '(.+):([0-9]+)'
        replacement: '$1:$2'
        target_label: '__address__'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_label_com_fb_agent_release']
        target_label: release

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/http.json']
    relabel_configs:
      - source_labels: [__meta_probe]
        target_label: probe
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
