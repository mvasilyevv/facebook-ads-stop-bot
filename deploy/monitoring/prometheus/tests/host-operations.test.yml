rule_files:
  - /etc/prometheus/rules/fb-agent.yml

evaluation_interval: 15s

tests:
  - name: mixed topology only requires host-operation metrics from applications
    interval: 15s
    input_series:
      - series: 'up{job="expected-application-host",role="application",node="fb-agent-app-1",instance="localhost:9090"}'
        values: '1+0x20'
      - series: 'up{job="node",role="application",node="fb-agent-app-1",instance="app-node:9100"}'
        values: '1+0x20'
      - series: 'up{job="node",role="monitoring",node="fb-agent-monitoring-1",instance="node-exporter:9100"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: FBHostOperationMetricsAbsent
        exp_alerts:
          - exp_labels:
              node: fb-agent-app-1
              instance: app-node:9100
              severity: critical
              service: platform
            exp_annotations:
              summary: Host operation metrics are absent on a healthy node-exporter
              description: The root-owned textfile collector is not exposing any FB_Agent host operation state for fb-agent-app-1/app-node:9100.

  - name: mixed topology is healthy when the application textfile metric exists
    interval: 15s
    input_series:
      - series: 'up{job="expected-application-host",role="application",node="fb-agent-app-1",instance="localhost:9090"}'
        values: '1+0x20'
      - series: 'up{job="node",role="application",node="fb-agent-app-1",instance="app-node:9100"}'
        values: '1+0x20'
      - series: 'up{job="node",role="monitoring",node="fb-agent-monitoring-1",instance="node-exporter:9100"}'
        values: '1+0x20'
      - series: 'fb_agent_host_operation_status{role="application",node="fb-agent-app-1",instance="app-node:9100",operation="release_reconcile"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: FBHostOperationMetricsAbsent
        exp_alerts: []

  - name: inventoried application remains missing after more than twenty four hours
    interval: 15s
    input_series:
      - series: 'up{job="expected-application-host",role="application",node="fb-agent-app-1",instance="localhost:9090"}'
        values: '1+0x6000'
      - series: 'up{job="node",role="monitoring",node="fb-agent-monitoring-1",instance="node-exporter:9100"}'
        values: '1+0x6000'
    alert_rule_test:
      - eval_time: 25h
        alertname: FBNodeExporterSeriesAbsent
        exp_alerts:
          - exp_labels:
              node: fb-agent-app-1
              severity: critical
              service: platform
            exp_annotations:
              summary: Expected application node-exporter series disappeared
              description: Application host fb-agent-app-1 remains in durable inventory but its node-exporter series is absent.
