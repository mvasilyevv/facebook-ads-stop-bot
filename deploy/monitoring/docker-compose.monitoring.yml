# Мониторинг-стек FB Agent (отдельный compose-проект, не мешает основному).
#
# Состав:
#   node-exporter — метрики хоста (CPU, RAM, диск, uptime, сеть, load).
#   cadvisor      — метрики по каждому docker-контейнеру (CPU/RAM/restarts).
#   prometheus    — metrics + rules + remote-write receiver, retention 15d/2GB.
#   loki          — хранилище логов (retention 7d).
#   alloy         — Docker logs + OTLP ingest; replaces end-of-life Promtail.
#   tempo         — trace storage (retention 7d).
#   alertmanager  — alert grouping/inhibition/routing.
#   blackbox      — public liveness/readiness probes.
#   grafana       — дашборды (provisioning datasource + дашборд "Server Overview").
#
# Запуск:   cd /opt/fb-agent/current/deploy/monitoring && docker compose -f docker-compose.monitoring.yml up -d
# Доступ:   Grafana на 127.0.0.1:3000 (наружу не торчит).
#           - SSH-туннель:  ssh -L 3000:localhost:3000 root@<server>  → http://localhost:3000
#           - Либо через Caddy (monitor.adpulse.su) — см. README.md.
#
# Пароль Grafana admin берётся из .env.monitoring (создать из .env.monitoring.example).

name: fb_agent_monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:?set NODE_EXPORTER_IMAGE to image@sha256}
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker)($$|/)'
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    networks: [monitoring]
    logging: *logging

  cadvisor:
    image: ${CADVISOR_IMAGE:?set CADVISOR_IMAGE to image@sha256}
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]
    logging: *logging

  prometheus:
    image: ${PROMETHEUS_IMAGE:?set PROMETHEUS_IMAGE to image@sha256}
    # Docker discovery needs read access to the host socket. The container is
    # otherwise isolated and Prometheus is bound only to the private ingest IP.
    user: "0:0"
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus_data:/prometheus
    ports:
      - "${MONITORING_INGEST_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    networks: [monitoring]
    logging: *logging

  loki:
    image: ${LOKI_IMAGE:?set LOKI_IMAGE to image@sha256}
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "${MONITORING_INGEST_BIND_ADDRESS:-127.0.0.1}:3100:3100"
    networks: [monitoring]
    logging: *logging

  alloy:
    image: ${ALLOY_IMAGE:?set ALLOY_IMAGE to image@sha256}
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      NODE_NAME: ${NODE_NAME:-fb-agent-monitoring}
      LOKI_WRITE_URL: http://loki:3100/loki/api/v1/push
      TEMPO_OTLP_HTTP_URL: http://tempo:4318
    volumes:
      - ./alloy/central.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "${MONITORING_INGEST_BIND_ADDRESS:-127.0.0.1}:4317:4317"
      - "${MONITORING_INGEST_BIND_ADDRESS:-127.0.0.1}:4318:4318"
      - "127.0.0.1:12345:12345"
    networks: [monitoring]
    logging: *logging
    depends_on:
      - loki
      - tempo
    security_opt:
      - no-new-privileges:true

  tempo:
    image: ${TEMPO_IMAGE:?set TEMPO_IMAGE to image@sha256}
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "${MONITORING_INGEST_BIND_ADDRESS:-127.0.0.1}:3200:3200"
    networks: [monitoring]
    logging: *logging

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?set ALERTMANAGER_IMAGE to image@sha256}
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--enable-feature=utf8-strict-mode'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERTMANAGER_WEBHOOK_TOKEN_FILE:?set ALERTMANAGER_WEBHOOK_TOKEN_FILE}:/run/secrets/alertmanager_webhook_token:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [monitoring]
    logging: *logging

  blackbox-exporter:
    image: ${BLACKBOX_IMAGE:?set BLACKBOX_IMAGE to image@sha256}
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [monitoring]
    logging: *logging

  grafana:
    image: ${GRAFANA_IMAGE:?set GRAFANA_IMAGE to image@sha256}
    restart: unless-stopped
    # env_file прокидывает GF_SECURITY_ADMIN_PASSWORD / GF_SERVER_ROOT_URL прямо в
    # контейнер (нативные имена Grafana) — без интерполяции ${} из .env проекта.
    env_file: ${MONITORING_ENV_FILE:-.env.monitoring}
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [monitoring]
    logging: *logging
    depends_on:
      - prometheus
      - loki
      - tempo
      - alertmanager

networks:
  monitoring:

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  alloy_data:
  tempo_data:
  alertmanager_data:
