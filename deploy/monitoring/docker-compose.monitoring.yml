# Мониторинг-стек FB Agent (отдельный compose-проект, не мешает основному).
#
# Состав:
#   node-exporter — метрики хоста (CPU, RAM, диск, uptime, сеть, load).
#   cadvisor      — метрики по каждому docker-контейнеру (CPU/RAM/restarts).
#   prometheus    — сбор метрик (node-exporter + cadvisor + наш api /metrics), retention 15d/2GB.
#   loki          — хранилище логов (retention 7d).
#   promtail      — сбор docker-логов всех контейнеров → loki (поиск ошибок в Grafana).
#   grafana       — дашборды (provisioning datasource + дашборд "Server Overview").
#
# Запуск:   cd /opt/fb-agent/current/deploy/monitoring && docker compose -f docker-compose.monitoring.yml up -d
# Доступ:   Grafana на 127.0.0.1:3000 (наружу не торчит).
#           - SSH-туннель:  ssh -L 3000:localhost:3000 root@<server>  → http://localhost:3000
#           - Либо через Caddy (monitor.adpulse.su) — см. README.md.
#
# Пароль Grafana admin берётся из .env.monitoring (создать из .env.monitoring.example).

name: fb_agent_monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker)($$|/)'
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    logging: *logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]
    logging: *logging

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring, fbagent]
    logging: *logging

  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [monitoring]
    logging: *logging

  promtail:
    image: grafana/promtail:2.9.8
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]
    logging: *logging
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    # env_file прокидывает GF_SECURITY_ADMIN_PASSWORD / GF_SERVER_ROOT_URL прямо в
    # контейнер (нативные имена Grafana) — без интерполяции ${} из .env проекта.
    env_file: .env.monitoring
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [monitoring]
    logging: *logging
    depends_on:
      - prometheus
      - loki

networks:
  monitoring:
  # Внешняя сеть основного стека — чтобы prometheus скрейпил api:8100/metrics по имени.
  fbagent:
    external: true
    name: fb_agent_default

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
