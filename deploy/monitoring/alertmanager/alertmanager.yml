global:
  resolve_timeout: 5m

# Alert delivery is intentionally not sent directly to Telegram. Alertmanager
# writes to the authenticated application webhook; that handler commits the
# incident and notification outbox in PostgreSQL before returning success.
route:
  receiver: durable-notification-plane
  group_by: [alertname, severity, service]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: durable-notification-plane
      matchers:
        - severity="critical"
      group_wait: 0s
      repeat_interval: 30m

receivers:
  - name: durable-notification-plane
    webhook_configs:
      - url: https://app.adpulse.su/api/v1/integrations/alertmanager/webhook
        send_resolved: true
        max_alerts: 100
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alertmanager_webhook_token

inhibit_rules:
  - source_matchers:
      - alertname="FBApplicationUnavailable"
    target_matchers:
      - severity=~"warning|critical"
    equal: [instance]
