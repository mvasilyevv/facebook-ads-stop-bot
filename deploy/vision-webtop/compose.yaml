services:
  webtop:
    build:
      context: .
      dockerfile: Dockerfile
    image: fb-agent/vision-webtop:3.6.8-clipboard2
    container_name: vision-webtop
    restart: unless-stopped
    shm_size: 2gb
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Kaliningrad}
      TITLE: Vision Desktop
      CUSTOM_USER: ${CUSTOM_USER:-abc}
      DISPLAY_WIDTH: "1366"
      DISPLAY_HEIGHT: "768"
      DISPLAY_DPI: "96"
      SELKIES_IS_MANUAL_RESOLUTION_MODE: "true|locked"
      SELKIES_MANUAL_WIDTH: "1366"
      SELKIES_MANUAL_HEIGHT: "768"
      SELKIES_SCALING_DPI: "96"
      DESKTOP_VNC_PASSWORD: ${DESKTOP_VNC_PASSWORD:?set DESKTOP_VNC_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      # 8080 is already the host-side port of the main AdPulse frontend.
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:3030:3030"
      - "127.0.0.1:50051:50051"
    volumes:
      - ./config:/config
    networks:
      - fb-agent
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --silent --fail --max-time 3 http://127.0.0.1:3000/ >/dev/null
          && pgrep -x X0tigervnc >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    network_mode: service:webtop
    command: ["-b", "127.0.0.1"]
    depends_on:
      webtop:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822"]
      interval: 10s
      timeout: 3s
      retries: 6

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    network_mode: service:webtop
    depends_on:
      webtop:
        condition: service_healthy
      guacd:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: 127.0.0.1
      GUACD_PORT: "4822"
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${DESKTOP_GUACAMOLE_JSON_SECRET:?set DESKTOP_GUACAMOLE_JSON_SECRET}
      WEBAPP_CONTEXT: guacamole
      REMOTE_IP_VALVE_ENABLED: "true"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --silent --fail --max-time 3 http://127.0.0.1:8080/guacamole/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  fb-agent:
    name: fb_agent_default
    external: true
