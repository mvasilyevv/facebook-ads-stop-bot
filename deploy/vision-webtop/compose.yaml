name: fb_agent_vision

services:
  webtop:
    image: ${DESKTOP_WEBTOP_IMAGE:?set DESKTOP_WEBTOP_IMAGE to an immutable image@sha256 reference}
    container_name: vision-webtop
    restart: unless-stopped
    shm_size: 2gb
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Kaliningrad}
      DESKTOP_KASM_SERVICE_USER: ${DESKTOP_KASM_SERVICE_USER:?set DESKTOP_KASM_SERVICE_USER}
      DESKTOP_KASM_SERVICE_PASSWORD: ${DESKTOP_KASM_SERVICE_PASSWORD:?set DESKTOP_KASM_SERVICE_PASSWORD}
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:8444:8444"
    volumes:
      - ./config:/config
    networks:
      fb-agent:
        aliases:
          - vision-webtop
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    labels:
      com.fb-agent.managed: "true"
      com.fb-agent.cluster-id: ${FB_AGENT_BOOTSTRAP_CLUSTER_ID:?set FB_AGENT_BOOTSTRAP_CLUSTER_ID}
      com.fb-agent.purpose: vision
      com.fb-agent.release: ${FB_AGENT_VISION_RELEASE_ID:?set FB_AGENT_VISION_RELEASE_ID}

networks:
  fb-agent:
    name: fb_agent_safety_first_platform
    external: true
