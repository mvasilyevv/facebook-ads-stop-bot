---
desktop:
  # Стартовый размер до первого клиента. Дальше стол подстраивается под окно
  # браузера оператора: при запрете на ресайз рабочая область была намертво
  # зашита в 1366x768 и на большом мониторе показывалась растянутой картинкой.
  # Отпечаток кабинета от этого не зависит — окно самого Vision держится
  # отдельно, см. vision-window-fit.sh.
  resolution:
    width: 1366
    height: 768
  allow_resize: true
  pixel_depth: 24
  gpu:
    hw3d: false

network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: 8444
  use_ipv4: true
  use_ipv6: false
  udp:
    public_ip: 127.0.0.1
  ssl:
    require_ssl: false

user_session:
  session_type: shared
  new_session_disconnects_existing_exclusive_session: false
  concurrent_connections_prompt: false
  idle_timeout: never

keyboard:
  ignore_numlock: false
  raw_keyboard: false

pointer:
  enabled: true

runtime_configuration:
  allow_client_to_override_kasm_server_settings: false
  allow_override_standard_vnc_server_settings: false
  allow_override_list: []

logging:
  log_writer_name: all
  # stdout эта сборка KasmVNC не принимает и падает на разборе конфига.
  # Лог уходит в профиль, который смонтирован с хоста и доступен оператору.
  log_dest: logfile
  level: 30

data_loss_prevention:
  clipboard:
    delay_between_operations: none
    allow_mimetypes:
      - text/plain
    server_to_client:
      enabled: true
      size: 262144
      primary_clipboard_enabled: false
    client_to_server:
      enabled: true
      size: 262144
  keyboard:
    enabled: true
    rate_limit: unlimited
  logging:
    level: off

encoding:
  max_frame_rate: 30
  video_encoding_mode:
    # Верхняя граница режима видео-кодирования, а не размера стола: выше этого
    # разрешения кодировщик не переключается на видео-поток. На 4 vCPU без GPU
    # поднимать её незачем — рабочая область может быть больше, платить за неё
    # видео-кодированием мы не хотим.
    max_resolution:
      width: 1366
      height: 768

server:
  http:
    httpd_directory: /usr/share/kasmvnc/www
  advanced:
    kasm_password_file: /config/.kasmpasswd
    x_authority_file: auto
  auto_shutdown:
    no_user_session_timeout: never
    active_user_session_timeout: never
    inactive_user_session_timeout: never

command_line:
  prompt: false
