<!-- Replace Guacamole's own token-only logout with the single AdPulse exit.
     The POST revokes the Redis session, expires the scoped cookie, and returns
     the operator to the panel. This patch uses Guacamole's supported extension
     HTML mechanism and applies to both the home and in-session user menus. -->
<meta name="replace" content=".user-menu guac-menu > ul.action-list:last-child">
<ul class="action-list adpulse-desktop-actions">
  <li>
    <form method="post" action="/desktop/logout">
      <button type="submit" class="adpulse-desktop-return">Вернуться в панель</button>
    </form>
  </li>
</ul>
