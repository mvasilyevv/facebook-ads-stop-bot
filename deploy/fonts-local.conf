<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Качество рендеринга: сглаживание + субпиксельный хинтинг (как ClearType) -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <!-- Windows-подобные шрифты по умолчанию (Liberation = метрики Arial/Times/Courier) -->
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>Noto Serif</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family><family>Noto Sans Mono</family><family>Noto Color Emoji</family></prefer></alias>
  <!-- Маппинг Windows-шрифтов сайтов (FB и пр.) на Liberation -->
  <match target="pattern"><test name="family"><string>Segoe UI</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Helvetica</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <!-- Emoji fallback для любого шрифта (убирает "фиолетовый кружок" = missing glyph) -->
  <match target="pattern"><edit name="family" mode="append"><string>Noto Color Emoji</string></edit></match>
</fontconfig>
