name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: One-time host bootstrap using reviewed remote adoption/profile paths
        required: true
        type: boolean
        default: false
      bootstrap_mode:
        description: >-
          Bootstrap mode (required when bootstrap is true).
          clean — brand-new host, no prior identity; migration flags must not be used.
          migrate-identity — carry over OIDC/owner identity from the legacy source.
        required: false
        type: choice
        options:
          - clean
          - migrate-identity

permissions:
  contents: read

# Деплой запускается только вручную (см. условие job deploy), поэтому прогон от
# push ничего не выкатывает — он лишь собирает образы и гоняет rehearsal. Такие
# прогоны отменяют друг друга: серия коммитов подряд иначе выстраивает очередь
# по полчаса, и свежий код ждёт за уже неактуальным. Ручной запуск живёт в
# отдельной группе и не отменяется никогда: его отмена оборвала бы деплой.
concurrency:
  group: release-main-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify:
    name: Verify release source
    uses: ./.github/workflows/verify.yml
    with:
      full_run: ${{ github.event_name == 'workflow_dispatch' }}

  bootstrap-source-preflight:
    name: Validate bootstrap source
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # На чистом host проверять нечего удалённо: прежней identity нет, а
      # удалённая проверка существует только ради миграционного контракта и
      # сама отвергает вызов без него. Ценность гейта в том, чтобы отвергнуть
      # негодный source до сборки images, а это проверка самого source — без
      # доступа к host и без деплойного ключа в этой джобе.
      - name: Validate bootstrap source (clean)
        if: ${{ inputs.bootstrap_mode == 'clean' }}
        env:
          PROD_ENV_B64: ${{ secrets.PROD_ENV_B64 }}
        run: |
          set -euo pipefail
          test -n "$PROD_ENV_B64"
          printf '%s' "$PROD_ENV_B64" | base64 --decode | scripts/fbctl bootstrap-source-check \
            --stdin
      - name: Validate bootstrap source (migrate-identity)
        if: ${{ inputs.bootstrap_mode == 'migrate-identity' }}
        env:
          PROD_ENV_B64: ${{ secrets.PROD_ENV_B64 }}
        run: |
          set -euo pipefail
          test -n "$PROD_ENV_B64"
          printf '%s' "$PROD_ENV_B64" | base64 --decode | scripts/fbctl bootstrap-source-check \
            --stdin \
            --project-known-legacy-source

  images:
    name: Resolve or publish images
    needs: [verify, bootstrap-source-preflight]
    if: >-
      ${{
        !cancelled() &&
        needs.verify.result == 'success' &&
        (
          needs.bootstrap-source-preflight.result == 'success' ||
          (
            needs.bootstrap-source-preflight.result == 'skipped' &&
            !(github.event_name == 'workflow_dispatch' && inputs.bootstrap)
          )
        )
      }}
    uses: ./.github/workflows/publish-images.yml
    with:
      release_id: ${{ github.sha }}
    permissions:
      contents: read
      packages: write

  control-bundle:
    name: Package fbctl control bundle
    needs: images
    if: >-
      ${{
        !cancelled() &&
        needs.images.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      artifact: fbctl-control-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download immutable image manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.images.outputs.manifest_artifact }}
          path: release-inputs
      - name: Build deterministic control bundle
        run: |
          scripts/fbctl bundle \
            --output fbctl.pyz \
            --release-id "${{ github.sha }}" \
            --release-manifest release-inputs/release.json \
            --source-root .
          cp release-inputs/release.json release.json
      - name: Upload control bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fbctl-control-${{ github.sha }}
          path: |
            fbctl.pyz
            release.json
          if-no-files-found: error
          retention-days: 7

  docker-rehearsal:
    name: Docker rehearsal (${{ matrix.case }})
    needs: [images, control-bundle]
    if: >-
      ${{
        !cancelled() &&
        needs.images.result == 'success' &&
        needs.control-bundle.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Шардов пять, и раньше они шли по два — тремя волнами, примерно восемь
      # минут вместо длительности одного шарда. Общих ресурсов у них нет:
      # каждый работает на своём раннере, со своим Docker и своим cluster-id,
      # поэтому ограничение было осторожностью, а не необходимостью.
      max-parallel: 5
      matrix:
        include:
          - case: fp0
            scenario: failpoints
            shard_index: 0
            shard_count: 4
          - case: fp1
            scenario: failpoints
            shard_index: 1
            shard_count: 4
          - case: fp2
            scenario: failpoints
            shard_index: 2
            shard_count: 4
          - case: fp3
            scenario: failpoints
            shard_index: 3
            shard_count: 4
          - case: acceptance
            scenario: acceptance
            shard_index: 0
            shard_count: 1
    permissions:
      contents: read
      packages: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download control bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.control-bundle.outputs.artifact }}
          path: release-inputs
      - name: Prepare explicit Docker credentials directory
        run: |
          docker_config="$RUNNER_TEMP/fb-agent-docker-config-${{ matrix.case }}"
          install -d -m 700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
      - name: Authenticate immutable release pulls
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute production-like single-slot rehearsal
        env:
          FB_AGENT_REHEARSAL_ACK: single-slot
        run: |
          sudo -n env -i \
            DOCKER_CONFIG="$DOCKER_CONFIG" \
            GITHUB_ACTIONS=true \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}-${{ matrix.case }}" \
            FB_AGENT_REHEARSAL_ACK="$FB_AGENT_REHEARSAL_ACK" \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -B -m tests.rehearsal.single_slot \
              release-inputs/fbctl.pyz \
              release-inputs/release.json \
              --source-root . \
              --scenario "${{ matrix.scenario }}" \
              --shard-index "${{ matrix.shard_index }}" \
              --shard-count "${{ matrix.shard_count }}"

  deploy:
    name: Deploy fbctl bundle
    needs: [images, control-bundle, docker-rehearsal]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        vars.CI_DEPLOY_ENABLED == 'true' &&
        needs.images.result == 'success' &&
        needs.control-bundle.result == 'success' &&
        needs.docker-rehearsal.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download control bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.control-bundle.outputs.artifact }}
          path: release-inputs
      - name: Configure pinned SSH host identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # BatchMode запрещает спрашивать пароль: без него отказ аутентификации
          # вешает шаг на приглашении ввода. Полторы минуты молчания хоста
          # (интервал 15 × 6) переживает дешёвый VPS: весь удалённый apply идёт
          # одной ssh-сессией, и минутный столл sshd во время docker pull оборвал
          # бы исправную выкатку, оставив app и desktop остановленными.
          printf '%s\n' \
            'Host *' \
            '  StrictHostKeyChecking yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  ConnectTimeout 15' \
            '  ServerAliveInterval 15' \
            '  ServerAliveCountMax 6' > ~/.ssh/config
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
      - name: Install temporary GHCR credentials on production
        timeout-minutes: 5
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DOCKER_CONFIG: /tmp/fb-agent-ghcr-${{ github.run_id }}
        run: |
          # Validated CI values intentionally form the remote command.
          # shellcheck disable=SC2029
          ssh "$DEPLOY_TARGET" "install -d -m 700 '$DEPLOY_DOCKER_CONFIG'"
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_TARGET" \
            "DOCKER_CONFIG='$DEPLOY_DOCKER_CONFIG' docker login ghcr.io --username '$GHCR_USER' --password-stdin >/dev/null"
      - name: Publish routine release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.bootstrap) }}
        timeout-minutes: 25
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_ROOT: /opt/fb-agent
          DEPLOY_DOCKER_CONFIG: /tmp/fb-agent-ghcr-${{ github.run_id }}
        run: >-
          scripts/fbctl publish
          --host "$DEPLOY_TARGET"
          --bundle release-inputs/fbctl.pyz
          --root "$DEPLOY_ROOT"
          --docker-config "$DEPLOY_DOCKER_CONFIG"
      - name: Bootstrap host and deploy first release (clean)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && inputs.bootstrap_mode == 'clean' }}
        timeout-minutes: 25
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_ROOT: /opt/fb-agent
          DEPLOY_DOCKER_CONFIG: /tmp/fb-agent-ghcr-${{ github.run_id }}
          PROD_ENV_B64: ${{ secrets.PROD_ENV_B64 }}
          BOOTSTRAP_ADOPTION_BUNDLE: /opt/fb-agent/shared/adoption-bundle-v1.json
          BOOTSTRAP_DESKTOP_PROFILE_SEED: /opt/fb-agent/shared/desktop-profile-seed
        run: |
          test -n "$PROD_ENV_B64"
          test -n "$BOOTSTRAP_ADOPTION_BUNDLE"
          test -n "$BOOTSTRAP_DESKTOP_PROFILE_SEED"
          printf '%s' "$PROD_ENV_B64" | base64 --decode | scripts/fbctl publish \
            --host "$DEPLOY_TARGET" \
            --bundle release-inputs/fbctl.pyz \
            --root "$DEPLOY_ROOT" \
            --source-env-stdin \
            --docker-config "$DEPLOY_DOCKER_CONFIG" \
            --bootstrap \
            --adoption-bundle-remote "$BOOTSTRAP_ADOPTION_BUNDLE" \
            --desktop-profile-seed-remote "$BOOTSTRAP_DESKTOP_PROFILE_SEED"
      - name: Bootstrap host and deploy first release (migrate-identity)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && inputs.bootstrap_mode == 'migrate-identity' }}
        timeout-minutes: 25
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_ROOT: /opt/fb-agent
          DEPLOY_DOCKER_CONFIG: /tmp/fb-agent-ghcr-${{ github.run_id }}
          PROD_ENV_B64: ${{ secrets.PROD_ENV_B64 }}
          BOOTSTRAP_ADOPTION_BUNDLE: /opt/fb-agent/shared/adoption-bundle-v1.json
          BOOTSTRAP_DESKTOP_PROFILE_SEED: /opt/fb-agent/shared/desktop-profile-seed
        run: |
          test -n "$PROD_ENV_B64"
          test -n "$BOOTSTRAP_ADOPTION_BUNDLE"
          test -n "$BOOTSTRAP_DESKTOP_PROFILE_SEED"
          printf '%s' "$PROD_ENV_B64" | base64 --decode | scripts/fbctl publish \
            --host "$DEPLOY_TARGET" \
            --bundle release-inputs/fbctl.pyz \
            --root "$DEPLOY_ROOT" \
            --source-env-stdin \
            --docker-config "$DEPLOY_DOCKER_CONFIG" \
            --bootstrap \
            --reuse-existing-caddy-credentials \
            --project-known-legacy-source \
            --adoption-bundle-remote "$BOOTSTRAP_ADOPTION_BUNDLE" \
            --desktop-profile-seed-remote "$BOOTSTRAP_DESKTOP_PROFILE_SEED"
      - name: Remove temporary GHCR credentials
        if: always()
        timeout-minutes: 5
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_DOCKER_CONFIG: /tmp/fb-agent-ghcr-${{ github.run_id }}
        run: |
          # The validated CI path is deliberately removed remotely.
          # shellcheck disable=SC2029
          ssh "$DEPLOY_TARGET" \
            "test ! -d '$DEPLOY_DOCKER_CONFIG' || { find '$DEPLOY_DOCKER_CONFIG' -type f -delete; rmdir '$DEPLOY_DOCKER_CONFIG'; }"

  report:
    name: Report release outcome
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Джоба, срубленная собственным timeout-minutes, приходит как cancelled, а
    # не failure — 19.08 так умерла джоба platform. Поэтому отчёт обязан
    # исполняться и на отменённом прогоне, иначе зависание, ради которого
    # пределы времени и ставились, осталось бы вообще без сообщения. Вытеснение
    # следующим пушем отличается уже внутри шага, по составу результатов.
    if: ${{ always() }}
    needs: [verify, bootstrap-source-preflight, images, control-bundle, docker-rehearsal, deploy]
    steps:
      # Наружу уходит только исход, имя провалившейся джобы и ссылка на прогон.
      # Сырой текст ошибки, пути на хосте и содержимое лога — никогда: сообщение
      # уходит в Telegram, а он хранит его дольше, чем живёт инцидент.
      - name: Notify Telegram
        # Судьба уведомления не решает судьбу релиза: провалившийся отчёт
        # покрасил бы успешную выкатку, и человек пошёл бы передеплоивать зря.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          VERIFY: ${{ needs.verify.result }}
          PREFLIGHT: ${{ needs.bootstrap-source-preflight.result }}
          IMAGES: ${{ needs.images.result }}
          BUNDLE: ${{ needs.control-bundle.result }}
          REHEARSAL: ${{ needs.docker-rehearsal.result }}
          DEPLOY: ${{ needs.deploy.result }}
          # Три условия, по которым выкатка пропускается молча. Без них отчёт
          # может сказать только «не выполнялась», и причину человек ищет сам.
          EVENT: ${{ github.event_name }}
          DEPLOY_ENABLED: ${{ vars.CI_DEPLOY_ENABLED }}
          REF: ${{ github.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Пока владелец не завёл секреты, релиз молчит, но не падает. Секреты
          # обязаны быть репозиторными: у этой джобы нет environment, и токен,
          # положенный в окружение production, сюда не приедет — шаг молча
          # вышел бы с кодом 0, а отчёт не заработал бы никогда.
          missing=""
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="TELEGRAM_BOT_TOKEN"
          [ -n "$TELEGRAM_CHAT_ID" ] || missing="${missing:+$missing, }TELEGRAM_ALERT_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Отчёт о релизе не отправлен: пусты репозиторные секреты ${missing}. Заводить их надо в Settings -> Secrets and variables -> Actions -> Repository secrets: у джобы отчёта нет environment, и секрет окружения production ей не виден."
            exit 0
          fi

          # Исход ровно трёхзначный. skipped — не успех выкатки: обычный push в
          # main деплой не запускает (он требует workflow_dispatch), и «Релиз
          # выкачен» на таком прогоне было бы прямой ложью. Но skipped и не
          # провал: пропущенное звено ни на чём не встало.
          # cancelled у джобы значит две разные вещи, и путать их нельзя:
          #  - весь прогон вытеснен следующим пушем — тогда отменено всё, что
          #    успело начаться, ни одна джоба не дошла до успеха, и говорить
          #    не о чем;
          #  - джоба упёрлась в собственный предел времени — тогда рядом есть
          #    успешные, и это ровно то зависание, ради которого пределы и
          #    заводились.
          failures=""
          timeouts=""
          succeeded=0
          for pair in "проверка:$VERIFY" "предполёт:$PREFLIGHT" "образы:$IMAGES" "бандл:$BUNDLE" "репетиция:$REHEARSAL" "выкатка:$DEPLOY"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            case "$result" in
              success) succeeded=$((succeeded + 1)) ;;
              skipped) ;;
              cancelled) timeouts="${timeouts:+$timeouts, }$name" ;;
              *) failures="${failures:+$failures, }$name ($result)" ;;
            esac
          done

          if [ -z "$failures" ] && [ -n "$timeouts" ] && [ "$succeeded" -eq 0 ]; then
            echo "прогон вытеснен следующим пушем — сообщать не о чем"
            exit 0
          fi

          failed="$failures"
          if [ -n "$timeouts" ]; then
            failed="${failed:+$failed, }предел времени: ${timeouts}"
          fi

          # Отчёт обязан отвечать на единственный вопрос читателя: тронут прод
          # или нет, и если нет — почему и что делать. «Выкатка не запускалась»
          # этого не отвечало: причин у пропуска несколько, а человек читает
          # сообщение в Telegram без доступа к условиям джобы.
          if [ -n "$failed" ]; then
            text="Релиз не выкачен. Встало на: ${failed}. ${RUN_URL}"
          elif [ "$DEPLOY" = "success" ]; then
            text="Релиз выкачен на прод. ${RUN_URL}"
          elif [ "$EVENT" != "workflow_dispatch" ]; then
            text="Образы собраны, прод не тронут: это прогон от пуша, а пуш не выкатывает никогда. Выкатка только вручную: Actions -> Release -> Run workflow. ${RUN_URL}"
          elif [ "$DEPLOY_ENABLED" != "true" ]; then
            text="Ручной запуск прошёл, но выкатка выключена тумблером: переменная CI_DEPLOY_ENABLED не равна true. ${RUN_URL}"
          elif [ "$REF" != "refs/heads/main" ]; then
            text="Ручной запуск прошёл, но выкатка идёт только с main, а запуск был с другой ветки. ${RUN_URL}"
          else
            text="Образы собраны, прод не тронут: выкатка не выполнялась. Смотри условия джобы Deploy fbctl bundle. ${RUN_URL}"
          fi

          # Токен в пути — требование Bot API, обойти его нечем. Наружу он не
          # утекает: GitHub маскирует значения секретов в логах, curl идёт с
          # --silent, а тело ответа отправляется в /dev/null.
          #
          # Ретрай здесь не подменяет предел времени: --max-time остаётся, а
          # --retry-max-time держит суммарный потолок. Это единственный алерт,
          # и терять его из-за 429 или транзиентной 5xx нельзя.
          curl --silent --show-error --fail --max-time 20 \
            --retry 3 --retry-all-errors --retry-max-time 60 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
