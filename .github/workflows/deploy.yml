name: CI/CD — тест, сборка образов, деплой

# Запускается при пуше в main и вручную через GitHub UI
on:
  push:
    branches: [main]
  workflow_dispatch:

# Предотвращаем параллельный деплой: новый прогон отменяет старый ожидающий
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Единый реестр образов — ghcr.io под именем репозитория
env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

# GITHUB_TOKEN: push образов в GHCR (build/build-base) + pull на деплое.
permissions:
  contents: read
  packages: write

# ─────────────────────────────────────────────
# JOB 1: тесты (unit + integration)
# ─────────────────────────────────────────────
jobs:
  test:
    name: Тесты (ruff + pytest)
    runs-on: ubuntu-latest

    # Поднимаем Postgres и Redis для интеграционных тестов.
    # Боевая БД не используется — только эти сервисы.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fb_agent
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: fb_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fb_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Настройка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── Регенерация pb2-стабов ────────────────────────────────────────────
      # КРИТИЧНО: committed pb2 может дрейфовать от proto (известная грабля).
      # Регенерируем ДО установки зависимостей, чтобы тесты всегда видели
      # актуальные стабы. Зеркалим команду из run.sh строки 713-728.
      - name: Установка grpcio-tools для регенерации pb2
        run: |
          # grpcio-tools И protobuf берём ТОЙ ЖЕ версии, что залочена в uv.lock для
          # рантайма. Иначе плавающий pip ставит свежее → регенерённый pb2 требует
          # grpcio/protobuf новее установленного в образе (uv sync --frozen) → краш
          # всех gRPC-воркеров (grpc version guard / ValidateProtobufRuntimeVersion).
          GRPCIO_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='grpcio'))")
          PROTOBUF_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='protobuf'))")
          echo "uv.lock: grpcio=${GRPCIO_VER} protobuf=${PROTOBUF_VER}; ставлю их же для регенерации pb2"
          pip install "grpcio-tools==${GRPCIO_VER}" "protobuf==${PROTOBUF_VER}"

      - name: Регенерация gRPC Python-стабов из proto/v1/*.proto
        run: |
          python -m grpc_tools.protoc \
            -Iproto \
            --python_out=clients/python_grpc \
            --grpc_python_out=clients/python_grpc \
            --pyi_out=clients/python_grpc \
            proto/v1/browser_session.proto \
            proto/v1/scanner.proto \
            proto/v1/creator.proto \
            proto/v1/meta_api.proto \
            proto/v1/ad_library.proto

          # grpc_tools генерирует absolute import `from v1 import ...` —
          # чиним на относительный (зеркало run.sh:728)
          python -c "
          from pathlib import Path
          for p in Path('clients/python_grpc/v1').glob('*_pb2_grpc.py'):
              p.write_text(p.read_text().replace('from v1 import ', 'from . import '))
          print('Импорты в *_pb2_grpc.py исправлены на относительные')
          "

      # ── Установка зависимостей проекта ────────────────────────────────────
      - name: Установка зависимостей (включая dev-extras для тестов)
        run: pip install -e ".[dev]"

      # ── Линтинг ───────────────────────────────────────────────────────────
      - name: ruff check (линтер)
        run: ruff check .

      # ── Тесты ─────────────────────────────────────────────────────────────
      # DATABASE_URL и REDIS_URL указывают на сервисы CI, не на боевые.
      - name: pytest — полный прогон
        env:
          DATABASE_URL: postgresql+asyncpg://fb_agent:ci_password@localhost:5432/fb_agent_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: fb_agent
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: fb_agent_test
          REDIS_URL: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # Тестовые заглушки — реальные ключи не нужны.
          # ENCRYPTION_KEY обязан быть валидным Fernet (32 байта base64) — иначе
          # тесты, реально шифрующие через Fernet (test_adsetpro_credentials), падают.
          ENCRYPTION_KEY: UOGaDCkFFfSv7XMSdwQq_rqmossFFl8wSG7z69_5nO0=
          VISION_X_TOKEN: ci_test_token
          VISION_PROFILE_ID: ci_test_profile
          TELEGRAM_BOT_TOKEN: ci:test_token
          API_KEY: ci_api_key
          ANTHROPIC_API_KEY: ci_anthropic_key
          OPENAI_API_KEY: ci_openai_key
        run: pytest tests/ -x --timeout=30 -q

  # ─────────────────────────────────────────────
  # JOB 2a: базовый Python-образ. Собирается ДО остальных — иначе параллельная
  # matrix не найдёт python-base (api/workers начинаются с FROM него).
  # ─────────────────────────────────────────────
  build-base:
    name: Сборка python-base
    runs-on: ubuntu-latest
    needs: test  # только после зелёных тестов
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pb2 регенерируем ДО сборки — committed-стабы дрейфуют от proto (грабля).
      - name: Установка grpcio-tools для регенерации pb2
        run: |
          # grpcio-tools И protobuf берём ТОЙ ЖЕ версии, что залочена в uv.lock для
          # рантайма. Иначе плавающий pip ставит свежее → регенерённый pb2 требует
          # grpcio/protobuf новее установленного в образе (uv sync --frozen) → краш
          # всех gRPC-воркеров (grpc version guard / ValidateProtobufRuntimeVersion).
          GRPCIO_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='grpcio'))")
          PROTOBUF_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='protobuf'))")
          echo "uv.lock: grpcio=${GRPCIO_VER} protobuf=${PROTOBUF_VER}; ставлю их же для регенерации pb2"
          pip install "grpcio-tools==${GRPCIO_VER}" "protobuf==${PROTOBUF_VER}"

      - name: Регенерация gRPC pb2-стабов
        run: |
          python -m grpc_tools.protoc \
            -Iproto \
            --python_out=clients/python_grpc \
            --grpc_python_out=clients/python_grpc \
            --pyi_out=clients/python_grpc \
            proto/v1/browser_session.proto \
            proto/v1/scanner.proto \
            proto/v1/creator.proto \
            proto/v1/meta_api.proto \
            proto/v1/ad_library.proto

          python -c "
          from pathlib import Path
          for p in Path('clients/python_grpc/v1').glob('*_pb2_grpc.py'):
              p.write_text(p.read_text().replace('from v1 import ', 'from . import '))
          "

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и push — python-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.python-base
          push: true
          cache-from: type=gha,scope=python-base
          cache-to: type=gha,mode=max,scope=python-base
          tags: |
            ${{ env.IMAGE_BASE }}-python-base:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-python-base:latest

  # ─────────────────────────────────────────────
  # JOB 2b: остальные образы (после python-base).
  # У api/workers Dockerfile начинается с FROM fb-stop-bot/python-base:latest —
  # подменяем источник на свежесобранный ghcr-образ через build-contexts.
  # ─────────────────────────────────────────────
  build:
    name: Сборка образов
    runs-on: ubuntu-latest
    needs: build-base

    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
            image_suffix: api
            is_python: true
          - name: workers
            dockerfile: docker/Dockerfile.workers
            image_suffix: workers
            is_python: true
          # browser-agent (нативно на хосте рядом с Vision, profile "agent"), а также
          # frontend/mini-app (опциональный profile "web") в Docker на боевом сервере
          # НЕ поднимаются → из CI build matrix исключены, чтобы не блокировать автодеплой
          # core-стека. Собираются отдельно при необходимости (см. docs/WINDOWS_DEPLOY/run).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pb2 нужен только Python-образам (api/workers наследуют python-base).
      - name: Установка grpcio-tools (только Python-образы)
        if: matrix.is_python
        run: |
          # grpcio-tools И protobuf берём ТОЙ ЖЕ версии, что залочена в uv.lock для
          # рантайма. Иначе плавающий pip ставит свежее → регенерённый pb2 требует
          # grpcio/protobuf новее установленного в образе (uv sync --frozen) → краш
          # всех gRPC-воркеров (grpc version guard / ValidateProtobufRuntimeVersion).
          GRPCIO_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='grpcio'))")
          PROTOBUF_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='protobuf'))")
          echo "uv.lock: grpcio=${GRPCIO_VER} protobuf=${PROTOBUF_VER}; ставлю их же для регенерации pb2"
          pip install "grpcio-tools==${GRPCIO_VER}" "protobuf==${PROTOBUF_VER}"

      - name: Регенерация gRPC pb2-стабов (только Python-образы)
        if: matrix.is_python
        run: |
          python -m grpc_tools.protoc \
            -Iproto \
            --python_out=clients/python_grpc \
            --grpc_python_out=clients/python_grpc \
            --pyi_out=clients/python_grpc \
            proto/v1/browser_session.proto \
            proto/v1/scanner.proto \
            proto/v1/creator.proto \
            proto/v1/meta_api.proto \
            proto/v1/ad_library.proto

          python -c "
          from pathlib import Path
          for p in Path('clients/python_grpc/v1').glob('*_pb2_grpc.py'):
              p.write_text(p.read_text().replace('from v1 import ', 'from . import '))
          "

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Python-образы: подменяем FROM fb-stop-bot/python-base:latest на ghcr-образ
      # из job build-base (build-contexts работает только если запись присутствует).
      - name: Сборка и push — ${{ matrix.name }} (Python)
        if: matrix.is_python
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-contexts: |
            fb-stop-bot/python-base:latest=docker-image://${{ env.IMAGE_BASE }}-python-base:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_suffix }}
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.image_suffix }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-${{ matrix.image_suffix }}:latest

      # Не-Python образы (browser-agent/frontend/mini-app) — без base и pb2.
      - name: Сборка и push — ${{ matrix.name }}
        if: ${{ !matrix.is_python }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_suffix }}
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.image_suffix }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-${{ matrix.image_suffix }}:latest

  # ─────────────────────────────────────────────
  # JOB 3: деплой на боевой сервер
  # Запускается только из ветки main (не из PR)
  # ─────────────────────────────────────────────
  deploy:
    name: Деплой на сервер
    runs-on: ubuntu-latest
    needs: build  # только после успешной сборки всех образов
    if: github.ref == 'refs/heads/main'
    # GITHUB_TOKEN с правом read:packages — им логинимся в GHCR на сервере,
    # без отдельного PAT (DEPLOY_GHCR_TOKEN больше не нужен).
    permissions:
      contents: read
      packages: read

    steps:
      - name: SSH-деплой → ${{ secrets.DEPLOY_HOST }}
        uses: appleboy/ssh-action@v1
        env:
          # Прокидываем в SSH-сессию: встроенный токен ранна + параметры образов.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_BASE: ${{ env.IMAGE_BASE }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Таймаут на всю операцию: pull тяжёлых образов может занять время
          command_timeout: 15m
          # appleboy/ssh-action не пробрасывает env автоматически — перечисляем явно
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_BASE,GIT_SHA
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PROJECT_DIR }}

            echo "=== [0/5] Обновление кода на сервере (docker-compose, миграции, скрипты) ==="
            # Образы несут код api/воркеров, но docker-compose.yml/entrypoint/скрипты
            # читаются с диска сервера — синхронизируем их с main. .env в .gitignore не тронется.
            # Лэндим РОВНО тот SHA, по которому собраны образы (не подвижный origin/main):
            # при двух быстрых пушах подряд origin/main мог уйти вперёд → код-на-диске
            # (миграции/compose/entrypoint) разойдётся с кодом внутри образов.
            git fetch --depth 1 origin "${GIT_SHA}"
            git reset --hard "${GIT_SHA}"

            echo "=== [1/5] Авторизация в GHCR на сервере (GITHUB_TOKEN ранна) ==="
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "=== [2/5] Pull свежих образов (тег: $GIT_SHA) + сохранение текущих для отката ==="
            # compose использует ЛОКАЛЬНЫЕ имена fb-stop-bot/<svc>:latest — тегаем
            # ghcr-образ именно в них, иначе up берёт устаревший локальный образ
            # и фиксы не доезжают (баг до 2026-06-21).
            # ПЕРЕД перетегом сохраняем текущий рабочий latest под :rollback — чтобы
            # при провале health-check вернуться на заведомо рабочие образы, а не
            # оставить прод на битом билде (раньше отката не было: красный CI = тихо
            # деградировавший прод, как в grpcio-инциденте 2026-06-21).
            for svc in python-base api workers; do
              if docker image inspect "fb-stop-bot/${svc}:latest" >/dev/null 2>&1; then
                docker tag "fb-stop-bot/${svc}:latest" "fb-stop-bot/${svc}:rollback"
              fi
              docker pull "${IMAGE_BASE}-${svc}:${GIT_SHA}"
              docker tag  "${IMAGE_BASE}-${svc}:${GIT_SHA}" "fb-stop-bot/${svc}:latest"
            done

            # Откат на предыдущие образы (только теги :rollback → :latest; схему БД НЕ
            # трогаем — alembic-миграции аддитивны, старый код переживает новую схему).
            # Best-effort, идемпотентно, вызывается один раз из провальной ветки.
            rollback_stack() {
              echo "!!! ОТКАТ: возвращаю :rollback → :latest и пересоздаю стек на предыдущих образах"
              for svc in python-base api workers; do
                if docker image inspect "fb-stop-bot/${svc}:rollback" >/dev/null 2>&1; then
                  docker tag "fb-stop-bot/${svc}:rollback" "fb-stop-bot/${svc}:latest"
                fi
              done
              docker compose up -d --remove-orphans --force-recreate || true
            }

            echo "=== [3/5] Миграции БД (alembic upgrade head) ==="
            if ! docker compose run --rm migrate; then
              echo "ДЕПЛОЙ ПРОВАЛЕН: миграции упали"; rollback_stack; exit 1
            fi

            echo "=== [4/5] Перезапуск core-стека (profiles web/agent исключены) ==="
            # --force-recreate: контейнеры держатся за image ID на момент создания;
            # после retag latest нужно пересоздать, иначе возьмут старый образ.
            docker compose up -d --remove-orphans --force-recreate

            echo "=== [5/5] Health-check (readyz + heartbeat) ==="
            ok=0
            for i in $(seq 1 18); do
              if docker exec fb_agent-api-1 sh -c \
                "curl -sf http://localhost:8100/readyz" 2>/dev/null | grep -q '"ready":true'; then
                echo "readyz: ready"; ok=1; break
              fi
              echo "ждём readyz ($i/18)..."; sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "ДЕПЛОЙ ПРОВАЛЕН: /readyz не стал ready за 90с"; rollback_stack; exit 1
            fi
            # heartbeat-гейт с retry-петлёй: воркеры пишут первый heartbeat не мгновенно,
            # одноразовая проверка давала ложный fail на холодном старте (ран 27905809942).
            hb_ok=0; HB=0
            for i in $(seq 1 12); do
              HB=$(docker exec fb_agent-redis-1 redis-cli --scan --pattern 'worker:heartbeat:*' | grep -c . || true)
              echo "heartbeat воркеров ($i/12): $HB"
              if [ "$HB" -ge 10 ]; then hb_ok=1; break; fi
              sleep 5
            done
            if [ "$hb_ok" -ne 1 ]; then
              echo "ДЕПЛОЙ ПРОВАЛЕН: воркеров с heartbeat $HB (<10) за 60с"; rollback_stack; exit 1
            fi

            echo "=== Деплой здоров: SHA $GIT_SHA, heartbeat=$HB ==="
