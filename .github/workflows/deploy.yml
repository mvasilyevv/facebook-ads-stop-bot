name: CI/CD — тест, сборка образов, деплой

# Запускается при пуше в main и вручную через GitHub UI
on:
  push:
    branches: [main]
  workflow_dispatch:

# Не запускаем деплои параллельно, но уже начатый SSH release не обрываем:
# следующий push ждёт завершения текущего атомарного переключения/rollback.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Единый реестр образов — ghcr.io под именем репозитория
env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

# GITHUB_TOKEN: push образов в GHCR для валидации Dockerfile и build-cache.
# Основные app-образы пока пересобираются на VPS. Исключение — Vision webtop:
# он публикуется отдельной job и передаётся в deploy строго как image@digest.
permissions:
  contents: read
  packages: write

# ─────────────────────────────────────────────
# JOB 1: тесты (unit + integration)
# ─────────────────────────────────────────────
jobs:
  test:
    name: Тесты (ruff + pytest)
    runs-on: ubuntu-latest

    # Поднимаем Postgres и Redis для интеграционных тестов.
    # Боевая БД не используется — только эти сервисы.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fb_agent
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: fb_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fb_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Настройка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── Регенерация pb2-стабов ────────────────────────────────────────────
      # КРИТИЧНО: committed pb2 может дрейфовать от proto (известная грабля).
      # Регенерируем ДО установки зависимостей, чтобы тесты всегда видели
      # актуальные стабы. Зеркалим команду из run.sh строки 713-728.
      - name: Установка grpcio-tools для регенерации pb2
        run: |
          # grpcio-tools И protobuf берём ТОЙ ЖЕ версии, что залочена в uv.lock для
          # рантайма. Иначе плавающий pip ставит свежее → регенерённый pb2 требует
          # grpcio/protobuf новее установленного в образе (uv sync --frozen) → краш
          # всех gRPC-воркеров (grpc version guard / ValidateProtobufRuntimeVersion).
          GRPCIO_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='grpcio'))")
          PROTOBUF_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='protobuf'))")
          echo "uv.lock: grpcio=${GRPCIO_VER} protobuf=${PROTOBUF_VER}; ставлю их же для регенерации pb2"
          pip install "grpcio-tools==${GRPCIO_VER}" "protobuf==${PROTOBUF_VER}"

      - name: Регенерация gRPC Python-стабов из proto/v1/*.proto
        run: |
          python -m grpc_tools.protoc \
            -Iproto \
            --python_out=clients/python_grpc \
            --grpc_python_out=clients/python_grpc \
            --pyi_out=clients/python_grpc \
            proto/v1/browser_session.proto \
            proto/v1/scanner.proto \
            proto/v1/creator.proto \
            proto/v1/meta_api.proto \
            proto/v1/ad_library.proto

          # grpc_tools генерирует absolute import `from v1 import ...` —
          # чиним на относительный (зеркало run.sh:728)
          python -c "
          from pathlib import Path
          for p in Path('clients/python_grpc/v1').glob('*_pb2_grpc.py'):
              p.write_text(p.read_text().replace('from v1 import ', 'from . import '))
          print('Импорты в *_pb2_grpc.py исправлены на относительные')
          "

      # ── Установка зависимостей проекта ────────────────────────────────────
      - name: Установка зависимостей (включая dev-extras для тестов)
        run: pip install -e ".[dev]"

      # ── Линтинг ───────────────────────────────────────────────────────────
      - name: ruff check (линтер)
        run: ruff check .

      # ── Тесты ─────────────────────────────────────────────────────────────
      # DATABASE_URL и REDIS_URL указывают на сервисы CI, не на боевые.
      - name: pytest — полный прогон
        env:
          DATABASE_URL: postgresql+asyncpg://fb_agent:ci_password@localhost:5432/fb_agent_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: fb_agent
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: fb_agent_test
          REDIS_URL: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # Тестовые заглушки — реальные ключи не нужны.
          # ENCRYPTION_KEY обязан быть валидным Fernet (32 байта base64) — иначе
          # тесты, реально шифрующие через Fernet (test_adsetpro_credentials), падают.
          ENCRYPTION_KEY: UOGaDCkFFfSv7XMSdwQq_rqmossFFl8wSG7z69_5nO0=
          VISION_X_TOKEN: ci_test_token
          VISION_PROFILE_ID: ci_test_profile
          TELEGRAM_BOT_TOKEN: ci:test_token
          API_KEY: ci_api_key
          ANTHROPIC_API_KEY: ci_anthropic_key
          OPENAI_API_KEY: ci_openai_key
        run: pytest tests/ -x --timeout=30 -q

  web-test:
    name: Frontend и browser-agent (lint + typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm 11.6.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Установка frontend-зависимостей
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Установка browser-agent зависимостей
        run: npm ci --prefix services/browser-agent

      - name: Browser-agent lint и tests
        run: |
          npm run lint --prefix services/browser-agent
          npm test --prefix services/browser-agent

  # ─────────────────────────────────────────────
  # JOB 2a: базовый Python-образ. Собирается ДО остальных — иначе параллельная
  # matrix не найдёт python-base (api/workers начинаются с FROM него).
  # ─────────────────────────────────────────────
  build-base:
    name: Валидационная сборка python-base (не deploy artifact)
    runs-on: ubuntu-latest
    needs: [test, web-test]  # только после зелёных backend/web/browser-agent тестов
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pb2 регенерируем ДО сборки — committed-стабы дрейфуют от proto (грабля).
      - name: Установка grpcio-tools для регенерации pb2
        run: |
          # grpcio-tools И protobuf берём ТОЙ ЖЕ версии, что залочена в uv.lock для
          # рантайма. Иначе плавающий pip ставит свежее → регенерённый pb2 требует
          # grpcio/protobuf новее установленного в образе (uv sync --frozen) → краш
          # всех gRPC-воркеров (grpc version guard / ValidateProtobufRuntimeVersion).
          GRPCIO_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='grpcio'))")
          PROTOBUF_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='protobuf'))")
          echo "uv.lock: grpcio=${GRPCIO_VER} protobuf=${PROTOBUF_VER}; ставлю их же для регенерации pb2"
          pip install "grpcio-tools==${GRPCIO_VER}" "protobuf==${PROTOBUF_VER}"

      - name: Регенерация gRPC pb2-стабов
        run: |
          python -m grpc_tools.protoc \
            -Iproto \
            --python_out=clients/python_grpc \
            --grpc_python_out=clients/python_grpc \
            --pyi_out=clients/python_grpc \
            proto/v1/browser_session.proto \
            proto/v1/scanner.proto \
            proto/v1/creator.proto \
            proto/v1/meta_api.proto \
            proto/v1/ad_library.proto

          python -c "
          from pathlib import Path
          for p in Path('clients/python_grpc/v1').glob('*_pb2_grpc.py'):
              p.write_text(p.read_text().replace('from v1 import ', 'from . import '))
          "

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и push — python-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.python-base
          push: true
          cache-from: type=gha,scope=python-base
          cache-to: type=gha,mode=max,scope=python-base
          tags: |
            ${{ env.IMAGE_BASE }}-python-base:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-python-base:latest

  # ─────────────────────────────────────────────
  # JOB 2b: остальные образы (после python-base).
  # У api/workers Dockerfile начинается с FROM fb-stop-bot/python-base:latest —
  # подменяем источник на свежесобранный ghcr-образ через build-contexts.
  # ─────────────────────────────────────────────
  build:
    name: Валидационная сборка образов (не deploy artifacts)
    runs-on: ubuntu-latest
    needs: build-base

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
            image_suffix: api
            is_python: true
          - name: workers
            dockerfile: docker/Dockerfile.workers
            image_suffix: workers
            is_python: true
          # frontend/mini-app (profile "web") — статика nginx, теперь собираются в CI и
          # деплоятся отдельным шагом [7/7] (после здорового ядра), чтобы правки UI ехали
          # автоматически (раньше требовалась ручная пересборка на хосте).
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
            image_suffix: frontend
            is_python: false
          - name: mini-app
            dockerfile: docker/Dockerfile.mini-app
            image_suffix: mini-app
            is_python: false
          - name: browser-agent
            dockerfile: docker/Dockerfile.browser-agent
            image_suffix: browser-agent
            is_python: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pb2 нужен только Python-образам (api/workers наследуют python-base).
      - name: Установка grpcio-tools (только Python-образы)
        if: matrix.is_python
        run: |
          # grpcio-tools И protobuf берём ТОЙ ЖЕ версии, что залочена в uv.lock для
          # рантайма. Иначе плавающий pip ставит свежее → регенерённый pb2 требует
          # grpcio/protobuf новее установленного в образе (uv sync --frozen) → краш
          # всех gRPC-воркеров (grpc version guard / ValidateProtobufRuntimeVersion).
          GRPCIO_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='grpcio'))")
          PROTOBUF_VER=$(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('uv.lock').read_text()); print(next(p['version'] for p in d['package'] if p['name']=='protobuf'))")
          echo "uv.lock: grpcio=${GRPCIO_VER} protobuf=${PROTOBUF_VER}; ставлю их же для регенерации pb2"
          pip install "grpcio-tools==${GRPCIO_VER}" "protobuf==${PROTOBUF_VER}"

      - name: Регенерация gRPC pb2-стабов (только Python-образы)
        if: matrix.is_python
        run: |
          python -m grpc_tools.protoc \
            -Iproto \
            --python_out=clients/python_grpc \
            --grpc_python_out=clients/python_grpc \
            --pyi_out=clients/python_grpc \
            proto/v1/browser_session.proto \
            proto/v1/scanner.proto \
            proto/v1/creator.proto \
            proto/v1/meta_api.proto \
            proto/v1/ad_library.proto

          python -c "
          from pathlib import Path
          for p in Path('clients/python_grpc/v1').glob('*_pb2_grpc.py'):
              p.write_text(p.read_text().replace('from v1 import ', 'from . import '))
          "

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Python-образы: подменяем FROM fb-stop-bot/python-base:latest на ghcr-образ
      # из job build-base (build-contexts работает только если запись присутствует).
      - name: Сборка и push — ${{ matrix.name }} (Python)
        if: matrix.is_python
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-contexts: |
            fb-stop-bot/python-base:latest=docker-image://${{ env.IMAGE_BASE }}-python-base:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_suffix }}
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.image_suffix }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-${{ matrix.image_suffix }}:latest

      # Не-Python образы (browser-agent/frontend/mini-app) — без base и pb2.
      - name: Сборка и push — ${{ matrix.name }}
        if: ${{ !matrix.is_python }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_suffix }}
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.image_suffix }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-${{ matrix.image_suffix }}:latest

  # Vision webtop is an independent production artifact. Unlike the app
  # images, the server never rebuilds it and accepts only this immutable digest.
  build-desktop:
    name: Production artifact — Vision webtop
    runs-on: ubuntu-latest
    needs: [test, web-test]
    outputs:
      image_ref: ${{ steps.artifact.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и push — Vision webtop
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/vision-webtop
          file: deploy/vision-webtop/Dockerfile
          push: true
          cache-from: type=gha,scope=vision-webtop
          cache-to: type=gha,mode=max,scope=vision-webtop
          tags: ${{ env.IMAGE_BASE }}-vision-webtop:${{ github.sha }}

      - name: Зафиксировать immutable reference
        id: artifact
        env:
          IMAGE_NAME: ${{ env.IMAGE_BASE }}-vision-webtop
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf 'image_ref=%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # JOB 3: деплой на боевой сервер (релизная схема releases/ + shared/.env)
  #
  # Хост переведён на release-based деплой: scripts/deploy-server.sh →
  # server-release.sh (rsync релиза, миграции, health-гейт, атомарное
  # переключение current, авто-rollback). Старый git-checkout-флоу удалён —
  # несовместим с раскладкой сервера (инцидент 15.07: cd в несуществующий
  # DEPLOY_PROJECT_DIR + БД уже на миграции, которой нет в git).
  # ВАЖНО: server-release.sh собирает образы из rsync-снимка на самом VPS; GHCR
  # images из build jobs выше сейчас служат только валидацией и кэшем.
  #
  # ГЕЙТ vars.CI_DEPLOY_ENABLED: автодеплой включается ТОЛЬКО когда весь боевой
  # контур закоммичен (docker-compose с новыми сервисами, докерфайлы под
  # релизные теги, миграция 0034 и её код). До этого автодеплой из чистого git
  # ОТКАТИЛ бы прод — фичи там из ещё не закоммиченной работы. Пока гейт
  # выключен, джоба скипается (пайплайн зелёный), деплой ручной одной командой:
  #   ./scripts/deploy-server.sh
  # Включение: gh variable set CI_DEPLOY_ENABLED --body true
  # ─────────────────────────────────────────────
  deploy:
    name: Деплой на сервер (релизная схема)
    runs-on: ubuntu-latest
    needs: [build, build-desktop]
    if: github.ref == 'refs/heads/main' && vars.CI_DEPLOY_ENABLED == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH-ключ и known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: .env-фолбэк из PROD_ENV_B64
        # deploy-server.sh требует локальный .env, но фактический источник
        # секретов — shared/.env на сервере (скрипт сам подтягивает его, если
        # существует). Фолбэк нужен только для инициализации чистого хоста.
        env:
          PROD_ENV_B64: ${{ secrets.PROD_ENV_B64 }}
        run: |
          if [ -n "$PROD_ENV_B64" ]; then
            printf '%s' "$PROD_ENV_B64" | base64 -d > .env
          else
            touch .env
          fi
          chmod 600 .env

      - name: Временная авторизация production Docker в GHCR
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_DOCKER_CONFIG: /tmp/fb-agent-ghcr-${{ github.run_id }}
        run: |
          ssh "$DEPLOY_TARGET" "install -d -m 700 '$DESKTOP_DOCKER_CONFIG'"
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_TARGET" \
            "DOCKER_CONFIG='$DESKTOP_DOCKER_CONFIG' docker login ghcr.io --username '$GHCR_USER' --password-stdin >/dev/null"

      - name: Деплой релиза
        timeout-minutes: 25
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DESKTOP_WEBTOP_IMAGE: ${{ needs.build-desktop.outputs.image_ref }}
          DESKTOP_DOCKER_CONFIG: /tmp/fb-agent-ghcr-${{ github.run_id }}
        run: ./scripts/deploy-server.sh

      - name: Удалить временную GHCR-авторизацию
        if: always()
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DESKTOP_DOCKER_CONFIG: /tmp/fb-agent-ghcr-${{ github.run_id }}
        run: |
          ssh "$DEPLOY_TARGET" \
            "test ! -d '$DESKTOP_DOCKER_CONFIG' || { find '$DESKTOP_DOCKER_CONFIG' -type f -delete; rmdir '$DESKTOP_DOCKER_CONFIG'; }"
