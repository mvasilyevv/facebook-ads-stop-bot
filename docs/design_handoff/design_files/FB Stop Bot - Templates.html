<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FB Stop Bot — Шаблоны экранов</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; background: #141416; }
  body { font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .canvas { min-height: 100vh; padding: 48px 0 96px; }
  .col { display: flex; flex-direction: column; gap: 64px; align-items: center; }
  .win { background: var(--bg-0); border: 1px solid var(--bg-6); position: relative; overflow: hidden; width: 1320px; }
  .winbar { height: 38px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--bg-1); border-bottom: 1px solid var(--bg-6); }
  .winbar .dots { display: flex; gap: 7px; }
  .winbar .dots i { width: 11px; height: 11px; border-radius: 999px; background: var(--bg-6); display: block; }
  .winurl { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--bg-9); background: var(--bg-0); border: 1px solid var(--bg-5); padding: 4px 14px; flex: 1; max-width: 420px; text-align: center; }
  .lbl { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; width: 1320px; }
  .lbl h2 { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: var(--bg-11); margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="dashboard-shared.jsx"></script>
<script type="text/babel" src="web-dashboard.jsx"></script>
<script type="text/babel" src="templates.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
function App() {
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const fit = () => setScale(Math.max(0.2, Math.min(1, ((window.innerWidth || 1840) - 80) / 1320)));
    fit();
    const raf = requestAnimationFrame(fit);
    const ro = new ResizeObserver(fit); ro.observe(document.documentElement);
    window.addEventListener('resize', fit);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); window.removeEventListener('resize', fit); };
  }, []);
  return (
    <div className="fb-scope" data-density="comfortable" data-fsm="muted">
      <div style={{ padding: '0 0 8px', textAlign: 'center' }}>
        <div className="eyebrow" style={{ marginBottom: 6, justifyContent: 'center' }}><span className="num">ШАБЛОНЫ</span><span style={{ color: 'var(--bg-7)' }}>/</span>ОСТАЛЬНЫЕ ЭКРАНЫ · СТАТИКА</div>
        <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 20, fontWeight: 500, color: 'var(--bg-11)' }}>FB Stop Bot — шаблоны для вёрстки</div>
        <div style={{ fontSize: 13, color: 'var(--bg-9)', marginTop: 8, maxWidth: 620, margin: '8px auto 0', lineHeight: 1.5 }}>Статичные hi-fi макеты на едином токен-наборе и shell. Не кликабельны — каркас и иерархия для передачи в работу.</div>
      </div>
      <div className="canvas">
        <div className="col" style={{ transform: `scale(${scale})`, transformOrigin: 'top center' }}>
          {window.TEMPLATES.map((tpl) => (
            <section key={tpl.id} style={{ width: 1320 }}>
              <div className="lbl"><h2>{tpl.name}</h2><span className="rulepill" style={{ height: 20, fontSize: 11 }}>{tpl.tag}</span></div>
              <div className="win">
                <div className="winbar"><span className="dots"><i /><i /><i /></span><span className="winurl">fb-stop-bot.internal / {tpl.id}</span><span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: 'var(--bg-8)', marginLeft: 'auto' }}>1320×{tpl.h}</span></div>
                <div style={{ height: tpl.h }}><tpl.el /></div>
              </div>
            </section>
          ))}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
