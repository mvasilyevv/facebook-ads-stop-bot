<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FB Stop Bot — Объявления · Web + Mini App</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; background: #141416; }
  body { font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { min-height: 100vh; padding: 40px 0 80px; overflow-x: hidden; }
  .row { display: flex; gap: 56px; align-items: flex-start; justify-content: center; transform-origin: top center; }
  .frame-label { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .win { background: var(--bg-0); border: 1px solid var(--bg-6); position: relative; overflow: hidden; }
  .winbar { height: 38px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--bg-1); border-bottom: 1px solid var(--bg-6); }
  .winbar .dots { display: flex; gap: 7px; }
  .winbar .dots i { width: 11px; height: 11px; border-radius: 999px; background: var(--bg-6); display: block; }
  .winurl { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--bg-9); background: var(--bg-0); border: 1px solid var(--bg-5); padding: 4px 14px; flex: 1; max-width: 420px; text-align: center; }
  h2.fl { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; color: var(--bg-11); margin: 0; letter-spacing: -0.01em; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script src="ads-data.js"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="dashboard-shared.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="web-dashboard.jsx"></script>
<script type="text/babel" src="mini-dashboard.jsx"></script>
<script type="text/babel" src="ads-web.jsx"></script>
<script type="text/babel" src="ads-mini.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const ACCENTS = {
  '#F5F1E8': { muted: '#BDB8AB', bg: '#2A2823' },
  '#EDE7D6': { muted: '#B3AC97', bg: '#272318' },
  '#F2EFE9': { muted: '#C2BDB2', bg: '#26241F' },
  '#E8DFC8': { muted: '#ABA386', bg: '#262213' },
};
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "comfortable",
  "accent": "#F5F1E8",
  "fsm": "muted",
  "sidebarCollapsed": false
}/*EDITMODE-END*/;

function Toast({ msg }) {
  if (!msg) return null;
  return <div style={{ position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)', zIndex: 3000, background: 'var(--bg-3)', border: '1px solid var(--bg-6)', color: 'var(--bg-11)', padding: '10px 16px', fontSize: 13, fontFamily: 'var(--font-body)' }}>{msg}</div>;
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [toast, setToast] = useState(null);
  const [scale, setScale] = useState(1);
  const timer = useRef(null);
  const showToast = (m) => { setToast(m); clearTimeout(timer.current); timer.current = setTimeout(() => setToast(null), 2600); };
  useEffect(() => {
    const fit = () => {
      const w = window.innerWidth || document.documentElement.clientWidth || 1840;
      setScale(Math.max(0.2, Math.min(1, (w - 72) / (1320 + 56 + 390))));
    };
    fit();
    const raf = requestAnimationFrame(fit);
    const ro = new ResizeObserver(fit); ro.observe(document.documentElement);
    window.addEventListener('resize', fit);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); window.removeEventListener('resize', fit); };
  }, []);
  const a = ACCENTS[t.accent] || ACCENTS['#F5F1E8'];
  const rootStyle = { '--accent': t.accent, '--accent-muted': a.muted, '--accent-bg': a.bg };
  return (
    <div className="fb-scope" data-density={t.density} data-fsm={t.fsm} style={rootStyle}>
      <div className="stage">
        <div className="row" style={{ transform: `scale(${scale})` }}>
          <div style={{ flex: 'none' }}>
            <div className="frame-label"><h2 className="fl">Веб</h2><span className="rulepill" style={{ height: 20, fontSize: 11 }}>desktop · 1280px+</span></div>
            <div className="win" style={{ width: 1320 }}>
              <div className="winbar"><span className="dots"><i /><i /><i /></span><span className="winurl">fb-stop-bot.internal / ads</span><span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: 'var(--bg-8)', marginLeft: 'auto' }}>1320×860</span></div>
              <div style={{ height: 860 }}>
                <WebAds collapsed={t.sidebarCollapsed} setCollapsed={(v) => setTweak('sidebarCollapsed', v)} density={t.density} onToast={showToast} />
              </div>
            </div>
          </div>
          <div style={{ flex: 'none' }}>
            <div className="frame-label"><h2 className="fl">Telegram Mini App</h2><span className="rulepill" style={{ height: 20, fontSize: 11 }}>mobile · touch</span></div>
            <IOSDevice dark width={390} height={844}>
              <MiniAds onToast={showToast} />
            </IOSDevice>
          </div>
        </div>
      </div>
      <Toast msg={toast} />
      <TweaksPanel title="Tweaks">
        <TweakSection label="Плотность" />
        <TweakRadio label="Density" value={t.density} options={['comfortable', 'compact', 'dense']} onChange={(v) => setTweak('density', v)} />
        <TweakSection label="Accent · warm-white" />
        <TweakColor label="Оттенок" value={t.accent} options={Object.keys(ACCENTS)} onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="FSM-цвета" />
        <TweakRadio label="Палитра" value={t.fsm} options={[{ value: 'muted', label: 'Muted' }, { value: 'vivid', label: 'Vivid' }, { value: 'mono', label: 'Mono' }]} onChange={(v) => setTweak('fsm', v)} />
        <TweakSection label="Веб" />
        <TweakToggle label="Sidebar свёрнут" value={t.sidebarCollapsed} onChange={(v) => setTweak('sidebarCollapsed', v)} />
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
