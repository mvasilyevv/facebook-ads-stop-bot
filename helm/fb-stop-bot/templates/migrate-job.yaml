apiVersion: batch/v1
kind: Job
metadata:
  name: fb-stop-bot-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fb-stop-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Запускается перед установкой и обновлением chart
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "fb-stop-bot.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/{{ .Values.image.workers.repository }}:{{ .Values.image.workers.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: WORKER_TYPE
              value: "migrate"
          envFrom:
            - configMapRef:
                name: fb-stop-bot-config
            - secretRef:
                name: fb-stop-bot-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
