{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fb-stop-bot-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fb-stop-bot.labels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.ingress.className "traefik" }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.api }}
        - {{ .Values.ingress.hosts.web }}
        - {{ .Values.ingress.hosts.tma }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    # API backend
    - host: {{ .Values.ingress.hosts.api }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fb-stop-bot-api
                port:
                  number: 8100
    # Web frontend (React SPA)
    - host: {{ .Values.ingress.hosts.web }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fb-stop-bot-frontend
                port:
                  number: 80
    # Telegram Mini App (путь /tma/)
    - host: {{ .Values.ingress.hosts.tma }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fb-stop-bot-mini-app
                port:
                  number: 80
{{- end }}
