# ПРИМЕР файла секретов — скопируй в secrets.yaml и заполни реальными значениями
# ВАЖНО: secrets.yaml добавлен в .gitignore — никогда не коммить реальные секреты!

secrets:
  # API ключ для аутентификации запросов к FastAPI
  apiKey: "ЗАМЕНИ_НА_СЛУЧАЙНУЮ_СТРОКУ_32_СИМВОЛА"

  # Токен Telegram Bot от @BotFather
  telegramBotToken: "1234567890:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"

  # X-токен для Vision anti-detect браузера
  visionXToken: "ТОКЕН_ИЗ_VISION_DASHBOARD"

  # Пароль пользователя Postgres
  postgresPassword: "ПАРОЛЬ_ОТ_POSTGRES"

  # Telegram user ID владельца бота (получить через @userinfobot)
  ownerTelegramUserId: "123456789"

  # Секретный ключ для подписи Telegram Mini App данных
  tmaSecretKey: "СЛУЧАЙНАЯ_СТРОКА_ДЛЯ_TMA"
