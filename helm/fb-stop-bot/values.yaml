# Основные значения для Helm chart FB Stop Bot
# Для production переопределяй в values-mini-pc.yaml или через --set

image:
  # Для k3s: images импортируются через `ctr images import`
  registry: localhost
  pullPolicy: IfNotPresent
  api:
    repository: fb-stop-bot/api
    tag: latest
  workers:
    repository: fb-stop-bot/workers
    tag: latest
  browserAgent:
    repository: fb-stop-bot/browser-agent
    tag: latest
  frontend:
    repository: fb-stop-bot/frontend
    tag: latest
  miniApp:
    repository: fb-stop-bot/mini-app
    tag: latest

# Postgres на хосте Windows (через Docker Desktop или docker-compose)
postgres:
  host: host.docker.internal
  port: 5433
  database: fb_stop_bot_v2
  user: fb_stop_bot_v2

# Vision anti-detect браузер на хосте Windows
vision:
  host: host.docker.internal
  port: 3030

# Секреты — создавать отдельно в secrets.yaml (НЕ коммитить!)
# Пример: helm/fb-stop-bot/secrets.example.yaml
secrets:
  apiKey: ""
  telegramBotToken: ""
  visionXToken: ""
  postgresPassword: ""
  ownerTelegramUserId: ""
  tmaSecretKey: ""

# Конфигурация browser-agent профилей
# Один Deployment + Service на каждый Vision-профиль
# ОБЯЗАТЕЛЬНО переопределить visionProfileId в values-mini-pc.yaml
browserAgents:
  - slug: default
    visionProfileId: ""
    replicas: 1

# URL для доступа к сервисам
urls:
  frontendUrl: "http://app.fbbot.local"
  webAppUrl: "http://tma.fbbot.local/tma/"
  apiUrl: "http://api.fbbot.local"

# Настройки Ingress (Traefik в k3s)
ingress:
  enabled: true
  className: traefik
  hosts:
    api: api.fbbot.local
    web: app.fbbot.local
    tma: tma.fbbot.local
  tls:
    enabled: false
    secretName: fb-stop-bot-tls

# Ресурсы по умолчанию (single-node, не используем HPA)
resources:
  api:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  worker:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  browserAgent:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  frontend:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "64Mi"
      cpu: "50m"
