[unix_http_server]
file=/tmp/fb_agent_supervisor.sock

[supervisord]
logfile=.logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/fb_agent_supervisor.sock

[program:observer_worker]
command=.venv/bin/python run_observer.py
directory=%(here)s
autorestart=true
startsecs=5
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=.logs/observer.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:disable_worker]
command=.venv/bin/python run_disable_worker.py
directory=%(here)s
autorestart=true
