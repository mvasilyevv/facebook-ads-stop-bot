[unix_http_server]
file=/tmp/fb_agent_supervisor.sock

[supervisord]
logfile=.logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/fb_agent_supervisor.sock

[program:browser_agent]
command=/usr/local/bin/node services/browser-agent/dist/index.js
environment=GRPC_PORT="50051"
directory=%(here)s
priority=10
autorestart=true
startsecs=10
stopwaitsecs=15
stopsignal=TERM
startretries=10
exitcodes=0,2
redirect_stderr=true
stdout_logfile=.logs/browser_agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:observer_worker]
command=.venv/bin/python run_observer.py
directory=%(here)s
priority=20
autorestart=true
startsecs=10
stopwaitsecs=15
stopsignal=TERM
startretries=10
exitcodes=0,2
redirect_stderr=true
stdout_logfile=.logs/observer.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

