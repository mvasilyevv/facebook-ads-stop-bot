services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fb_stop_bot_v2}
      POSTGRES_USER: ${POSTGRES_USER:-fb_stop_bot_v2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fb_stop_bot_v2}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6380:6379"
