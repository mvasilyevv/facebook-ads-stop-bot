# Local-only, fail-closed development contour.
#
# This root Compose file intentionally contains no browser, observer, scheduler,
# campaign or Meta mutation service. Production topology lives exclusively in
# deploy/compose/ and is operated by the platform release scripts.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-local-worker: &local-worker
  build:
    context: .
    dockerfile: docker/Dockerfile.workers
    args:
      BASE_IMAGE: ${IMAGE_REPOSITORY:-fb-stop-bot}/python-base:${IMAGE_TAG:-latest}
  image: ${IMAGE_REPOSITORY:-fb-stop-bot}/workers:${IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  logging: *default-logging
  mem_limit: 384m
  env_file:
    - path: .env
      required: false
  environment: &local-worker-env
    FB_AGENT_PROFILE: local
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fb_stop_bot_dev}
      POSTGRES_USER: ${POSTGRES_USER:-fb_stop_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fb_stop_bot_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.workers
      args:
        BASE_IMAGE: ${IMAGE_REPOSITORY:-fb-stop-bot}/python-base:${IMAGE_TAG:-latest}
    image: ${IMAGE_REPOSITORY:-fb-stop-bot}/workers:${IMAGE_TAG:-latest}
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      FB_AGENT_PROFILE: local
      WORKER_TYPE: migrate
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        BASE_IMAGE: ${IMAGE_REPOSITORY:-fb-stop-bot}/python-base:${IMAGE_TAG:-latest}
    image: ${IMAGE_REPOSITORY:-fb-stop-bot}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: 512m
    env_file:
      - path: .env
        required: false
    environment:
      FB_AGENT_PROFILE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  telegram_delivery_worker:
    <<: *local-worker
    environment:
      <<: *local-worker-env
      WORKER_TYPE: telegram_delivery

  telegram_update_worker:
    <<: *local-worker
    environment:
      <<: *local-worker-env
      WORKER_TYPE: telegram_updates

volumes:
  pgdata:
  redisdata:
